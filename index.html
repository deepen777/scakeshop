<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>🍰 甜蜜烘焙屋</title>
<style>
:root{
  --pink:#FF6B9D; --pink-d:#D6336C; --pink-l:#FFB6C1; --cream:#FFF8F0;
  --caramel:#C98A5B; --brown:#5C4953; --mint:#7BD1B8; --gold:#F5B841;
  --topH:56px; --tabH:54px; --railH:84px;
  --fs:15px;
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  background:radial-gradient(circle at 50% 0%,#FFE9EF 0%,#FFD9E4 45%,#F3D3DC 100%);
  display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;color:var(--brown);font-size:var(--fs);
  touch-action:manipulation;
}
#stage{
  position:relative;width:100vw;max-width:1180px;height:100vh;max-height:780px;
  background:var(--cream);overflow:hidden;
  box-shadow:0 18px 60px rgba(214,51,108,.28);
}
@supports (height:100dvh){
  #stage{height:100dvh;}
}
@media (min-width:1190px) and (min-height:800px){#stage{border-radius:22px;}}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;overflow:hidden;}
.screen.on{display:flex;}

/* ============ 通用控件 ============ */
.btn{
  font-family:inherit;font-size:var(--fs);font-weight:700;color:#fff;
  background:linear-gradient(#FF87B3,#FF5C94);border:none;border-radius:14px;
  padding:10px 20px;cursor:pointer;line-height:1.25;
  box-shadow:0 4px 0 #D6336C,0 6px 14px rgba(214,51,108,.3);
  transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D6336C,0 2px 6px rgba(214,51,108,.3);}
.btn.secondary{background:linear-gradient(#fff,#FFEFF4);color:var(--pink-d);box-shadow:0 4px 0 #E9A8BE,0 6px 14px rgba(214,51,108,.16);}
.btn.secondary:active{box-shadow:0 1px 0 #E9A8BE;}
.btn.ghost{background:rgba(255,255,255,.72);color:var(--brown);box-shadow:0 3px 0 rgba(0,0,0,.13);}
.btn.danger{background:linear-gradient(#FF8A6B,#F4512F);box-shadow:0 4px 0 #B93A1D;}
.btn.tiny{font-size:12px;padding:6px 12px;border-radius:11px;box-shadow:0 3px 0 currentColor;}
.btn.sm{font-size:13px;padding:8px 14px;}
.btn[disabled]{filter:grayscale(.7) brightness(1.05);cursor:not-allowed;opacity:.65;}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.7);
  border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;}
.tag{display:inline-block;background:#FFE3EC;color:var(--pink-d);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;}

/* 实体按键（3D 凸起） */
.pkey{
  font-family:inherit;font-size:20px;font-weight:800;color:#7A4A58;
  background:linear-gradient(#FFFFFF 0%,#FFF1F5 55%,#F6DEE7 100%);
  border:1px solid #E7B9CA;border-radius:12px;cursor:pointer;
  box-shadow:0 4px 0 #D292AB,0 6px 12px rgba(0,0,0,.16),inset 0 1px 0 #fff;
  transition:transform .05s,box-shadow .05s;
}
.pkey:active,.pkey.down{transform:translateY(4px);box-shadow:0 0 0 #D292AB,0 2px 5px rgba(0,0,0,.18),inset 0 1px 0 #fff;}

/* ============ 竖屏提示 ============ */
#rotateTip{
  position:absolute;top:0;right:0;bottom:0;left:0;z-index:900;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(135deg,#FFC9D8,#FFE0C7);text-align:center;padding:24px;
}
#rotateTip .ph{font-size:64px;animation:tilt 1.8s ease-in-out infinite;}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
#rotateTip .tx{font-size:19px;font-weight:800;line-height:1.7;}
@media (orientation:portrait) and (max-width:900px){#rotateTip{display:flex;}}

/* ============ 开场漫画 ============ */
#comicScreen{background:linear-gradient(160deg,#2F2A3A,#5B3F52 55%,#8A5A63);}
.comic-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0;}
.comic-frame{
  width:min(760px,96%);height:min(400px,84%);display:flex;gap:12px;
  background:#FFFDF8;border-radius:20px;padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.35);cursor:pointer;
}
.comic-art{font-size:clamp(26px,8.5vh,58px);}
.comic-art{
  flex:1.1;position:relative;border-radius:14px;overflow:hidden;min-height:0;
  display:flex;align-items:center;justify-content:center;background:#F6E7D8;
}
.comic-art .art-in{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;font-size:74px;}
.comic-art .big{font-size:96px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2));}
.comic-lines{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:4px 6px;min-width:0;}
.comic-lines .who{font-size:12px;font-weight:800;color:var(--pink-d);letter-spacing:1px;}
.comic-lines .line{
  font-size:clamp(13px,2.1vh,17px);line-height:1.85;min-height:3.7em;color:#432F3A;font-weight:600;
}
.comic-lines .line .cur{color:var(--pink);}
.comic-foot{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;
  padding:8px 14px 14px;position:relative;
}
.comic-dots{display:flex;gap:6px;}
.comic-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:.25s;}
.comic-dots i.now{background:#fff;width:22px;border-radius:4px;}
.comic-dots i.past{background:rgba(255,255,255,.65);}

/* ============ 主菜单 ============ */
#menuScreen{background:linear-gradient(180deg,#FFF3F7 0%,#FFE6EF 60%,#FFDCE8 100%);align-items:center;justify-content:center;}
.menu-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;text-align:center;}
.menu-title{font-size:clamp(30px,5.2vh,48px);font-weight:900;letter-spacing:2px;
  background:linear-gradient(180deg,#FF87B3,#D6336C);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(255,255,255,.85));}
.menu-sub{font-size:13px;color:#A5737F;font-weight:600;}
#menuChar{width:clamp(70px,13vh,120px);height:clamp(120px,22vh,205px);cursor:pointer;
  transition:transform .2s;}
#menuChar:active{transform:scale(.94);}
.menu-btns{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:460px;margin-top:4px;}
.menu-stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
.menu-stats .chip{background:#fff;color:var(--pink-d);box-shadow:0 2px 6px rgba(214,51,108,.15);font-size:12px;}

/* ============ 游戏舞台布局 ============ */
#gameRoot.on{display:grid;grid-template-rows:var(--topH) 1fr var(--railH) var(--tabH);height:100%;background:#FFF6EC;}
#topbar{
  display:flex;align-items:center;gap:7px;padding:0 10px;
  background:linear-gradient(135deg,#FF8FB1,#FF6B9D);color:#fff;box-shadow:0 3px 10px rgba(214,51,108,.3);z-index:20;
}
#topbar .stat{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.26);
  padding:4px 10px;border-radius:14px;font-size:13px;font-weight:800;white-space:nowrap;}
#topbar .stat b{font-size:15px;}
#topbar .sp{flex:1;}
#topbar .ico{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex:0 0 auto;}
#topbar .ico:active{transform:scale(.9);}
#timeStat.warn{background:#FF5722;animation:pulse .7s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

#views{position:relative;overflow:hidden;background:#FFF6EC;}
.view{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;overflow:hidden;}
.view.on{display:flex;}

/* 工位切换条 */
#tabs{display:flex;background:#fff;box-shadow:0 -3px 12px rgba(0,0,0,.1);z-index:20;}
.tab{
  flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  border:none;background:transparent;font-family:inherit;cursor:pointer;padding:4px 2px;color:#A88A93;font-size:11px;font-weight:700;
}
.tab .ti{font-size:19px;line-height:1;}
.tab.on{color:var(--pink-d);background:#FFF0F5;}
.tab.on .ti{transform:scale(1.15);}
.tab .badge{position:absolute;top:3px;right:50%;margin-right:-26px;min-width:17px;height:17px;border-radius:9px;
  background:#FF3D3D;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;}

/* 小票夹 */
#rail{
  background:repeating-linear-gradient(90deg,#F3E0CE 0 22px,#EFD9C4 22px 44px);
  border-top:3px solid #C9A47F;display:flex;align-items:center;gap:8px;padding:6px 10px;overflow-x:auto;overflow-y:hidden;
}
#rail::-webkit-scrollbar{height:0;}
#rail .rail-label{flex:0 0 auto;font-size:11px;font-weight:800;color:#8B6543;writing-mode:vertical-rl;letter-spacing:2px;}
.tick{
  flex:0 0 auto;width:66px;height:calc(var(--railH) - 22px);background:#FFFDF5;border-radius:5px;
  border-left:3px dashed #E7B9CA;box-shadow:0 3px 7px rgba(0,0,0,.18);position:relative;cursor:pointer;
  padding:4px 5px;font-size:10px;line-height:1.3;overflow:hidden;transform:rotate(-1deg);transition:transform .15s;
}
.tick:nth-child(odd){transform:rotate(1.2deg);}
.tick:active{transform:scale(.94);}
.tick .tk-no{font-weight:800;color:#A5737F;}
.tick .tk-em{font-size:19px;text-align:center;line-height:1.15;}
.tick .tk-st{position:absolute;bottom:2px;left:4px;font-size:9px;font-weight:800;}
.tick.s-wait{border-left-color:#FFB84D;}
.tick.s-build{background:#FFF8E0;border-left-color:#F5B841;}
.tick.s-fin{border-left-color:#7BD1B8;background:#F0FFF9;}
.tick.s-ready{border-left-color:#5AE06A;background:#F2FFF2;animation:tickGlow 1.1s infinite;}
@keyframes tickGlow{0%,100%{box-shadow:0 3px 7px rgba(0,0,0,.18)}50%{box-shadow:0 0 0 3px rgba(90,224,106,.55),0 3px 7px rgba(0,0,0,.18)}}
.tick.serve-need .tk-em{animation:bob .5s infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* ============ 前台接单 vOrder ============ */
.order-scene{flex:1;position:relative;display:flex;flex-direction:column;min-height:0;
  background:linear-gradient(180deg,#FFF1DE 0%,#FFE0C4 100%);overflow:hidden;}
.order-sky{position:absolute;top:0;left:0;right:0;height:34%;background:linear-gradient(180deg,#BDE6FF,#E9F6FF);}
.order-banner{
  position:relative;margin:6px auto 0;padding:5px 26px;border-radius:12px;
  background:linear-gradient(#FF9DBB,#FF6B9D);color:#fff;font-weight:900;font-size:16px;letter-spacing:3px;
  box-shadow:0 4px 0 #D6336C,0 6px 12px rgba(0,0,0,.2);text-align:center;white-space:nowrap;
}
.order-banner small{display:block;font-size:9px;letter-spacing:1px;opacity:.85;font-weight:600;}
.order-queue{
  position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,1.4vw,16px);
  padding:8px 10px 0;overflow-x:auto;overflow-y:hidden;min-height:0;
}
.order-queue::-webkit-scrollbar{height:0;}
.order-counter{
  position:relative;flex:0 0 auto;width:100%;height:26px;
  background:linear-gradient(#D99A64,#B87A46);border-top:4px solid #F4D3A8;
  box-shadow:0 -4px 12px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:8px;
}
.order-counter span{font-size:11px;color:#FFF3E2;font-weight:800;opacity:.85;}
.cust{
  position:relative;flex:0 0 auto;width:clamp(62px,9vw,86px);display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;animation:walkIn .5s cubic-bezier(.2,1.4,.5,1);
}
@keyframes walkIn{from{transform:translateY(24px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.cust .cb{width:100%;aspect-ratio:1;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:clamp(28px,5.4vh,44px);box-shadow:0 4px 0 rgba(0,0,0,.13),0 6px 12px rgba(0,0,0,.16);transition:transform .12s;}
.cust:active .cb{transform:scale(.9);}
.cust.head .cb{box-shadow:0 0 0 4px #FFD54F,0 0 0 8px rgba(255,213,79,.4),0 6px 12px rgba(0,0,0,.2);animation:headBob 1.1s infinite;}
@keyframes headBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.cust .nm{font-size:10px;font-weight:800;color:#8B6543;background:#FFF6E6;border-radius:7px;padding:1px 6px;}
.cust .pb{width:100%;height:6px;border-radius:4px;background:rgba(0,0,0,.14);overflow:hidden;}
.cust .pf{height:100%;width:100%;border-radius:4px;background:linear-gradient(90deg,#7BD1B8,#49C78D);transition:width .1s linear;}
.cust .pf.low{background:linear-gradient(90deg,#FFD54F,#FFB300);}
.cust .pf.crit{background:linear-gradient(90deg,#FF7B6B,#F4351F);}
.cust.thinking .cb::after{content:"💭";position:absolute;margin-top:-34px;margin-left:26px;font-size:20px;animation:bob .8s infinite;}
.cust.leaving{animation:walkOut .45s forwards;}
@keyframes walkOut{to{transform:translateX(-70px) scale(.6);opacity:0}}
.order-help{flex:0 0 auto;text-align:center;font-size:11px;color:#9A6E52;font-weight:700;padding:5px;background:rgba(255,255,255,.6);}
.empty-q{display:flex;align-items:center;justify-content:center;height:100%;color:#B08A6C;font-size:13px;font-weight:700;gap:6px;}

/* 顾客说话气泡 */
.say{
  position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;
  background:#fff;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:700;color:#5C4953;
  box-shadow:0 4px 12px rgba(0,0,0,.2);white-space:nowrap;z-index:5;
}
.say::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;}

/* ============ 工位面板通用 ============ */
.wb-head{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 10px;background:#FFF0F5;border-bottom:2px solid #FFD9E4;}
.wb-title{flex:1;font-size:12px;font-weight:800;color:var(--pink-d);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wb-body{flex:1;display:flex;min-height:0;position:relative;overflow:hidden;}
.mini-recipe{flex:0 0 auto;width:clamp(96px,14vw,132px);padding:6px;overflow-y:auto;background:#FFFDF7;border-left:2px dashed #FFD9E4;}
.mini-recipe::-webkit-scrollbar{width:0;}
.mini-recipe h5{font-size:10px;color:#A5737F;letter-spacing:1px;margin-bottom:4px;}
.rc-line{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 4px;border-radius:7px;margin-bottom:3px;background:#FFF3F7;}
.rc-line.ok{background:#E9FBF2;color:#2E8B62;}
.rc-line .e{font-size:14px;}
.pad-area{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;}
.pad-hint{flex:0 0 auto;text-align:center;font-size:11px;color:#9A6E52;font-weight:700;padding:4px;background:rgba(255,255,255,.55);}
.pad-hint b{color:var(--pink-d);}

/* 材料货架 */
.shelf{flex:0 0 auto;display:flex;gap:6px;padding:6px 8px;overflow-x:auto;background:linear-gradient(#F7E7D2,#EFDCC4);border-bottom:3px solid #D9B892;}
.shelf::-webkit-scrollbar{height:0;}
.shelf .sh-t{flex:0 0 auto;align-self:center;font-size:10px;font-weight:800;color:#8B6543;writing-mode:vertical-rl;letter-spacing:1px;}
.ing{
  flex:0 0 auto;min-width:52px;padding:3px 5px;background:#FFFDF7;border-radius:10px;border:2px solid #EFD9C4;
  border-top-width:3px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:grab;
  box-shadow:0 3px 0 #E0C6AC;touch-action:none;
}
.ing:active{transform:translateY(2px);box-shadow:0 1px 0 #E0C6AC;}
.ing .ie{font-size:19px;line-height:1.1;}
.ing .in{font-size:10px;font-weight:800;color:#7A5340;white-space:nowrap;}
.ing.sel{border-color:var(--pink);background:#FFF0F5;box-shadow:0 3px 0 var(--pink-l);}
.ing .kbd{position:absolute;margin:-46px 0 0 34px;font-size:8px;background:#5C4953;color:#fff;border-radius:4px;padding:0 3px;opacity:.55;}

/* 操作台 */
.pad-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;
  padding:30px 0 46px;
  background:radial-gradient(circle at 50% 42%,#FFFFFF 0%,#FFF2E4 60%,#F6E3CF 100%);}
.drag-ghost{position:fixed;z-index:9999;font-size:38px;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));}

/* 蛋糕叠层台 */
#cakePad{position:relative;width:190px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:14px;}
.cake-wrap{position:relative;width:170px;}
.st-layer{position:absolute;border-radius:7px;transition:transform .18s cubic-bezier(.2,1.5,.5,1);}
.st-fill{position:absolute;border-radius:3px;opacity:.95;}
.fcell{position:absolute;border-radius:4px;border:2px dashed #FFC7DA;background:rgba(255,240,246,.55);}
.fcell.smooth{border:2px solid #FFF0F5;background:#FFF3F7;box-shadow:inset 0 -2px 3px rgba(230,150,180,.35);}
.st-top{position:absolute;font-size:22px;cursor:grab;touch-action:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));z-index:3;}
.st-plate{width:180px;height:11px;border-radius:0 0 12px 12px;background:linear-gradient(#F2F2F2,#D8D8D8);box-shadow:0 4px 8px rgba(0,0,0,.2);position:relative;}
.st-plate::after{content:"";position:absolute;left:22px;right:22px;bottom:-7px;height:7px;border-radius:0 0 8px 8px;background:#C9C9C9;}
.frost-bar{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:3px 12px;
  font-size:12px;font-weight:800;color:#A5737F;box-shadow:0 2px 8px rgba(0,0,0,.14);white-space:nowrap;z-index:6;}
.frost-bar.done{background:#E9FBF2;color:#2E8B62;}

/* 面包揉面台 */
#breadPad{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.dough{width:clamp(90px,17vh,130px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#FFF3DC,#EBCE9E 70%,#D9B67F);
  border:3px solid #C79E69;box-shadow:0 6px 0 #B98F5C,0 10px 18px rgba(0,0,0,.2);cursor:grab;touch-action:none;
  display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;}
.dough.puff{animation:pufft .3s;}
@keyframes pufft{50%{transform:scale(1.06)}}
.spin-ring{position:absolute;inset:-14px;border-radius:50%;border:3px dashed rgba(255,107,157,.5);opacity:0;}
.dough.knead .spin-ring{opacity:1;animation:spin 1.1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.oven{
  width:clamp(150px,30vh,220px);aspect-ratio:1.25;border-radius:16px;
  background:linear-gradient(#8A8A96,#5F5F6B);border:5px solid #43434D;position:relative;
  box-shadow:0 8px 0 #35353E,0 12px 20px rgba(0,0,0,.3);padding:12px;
}
.oven .door{position:absolute;left:10px;right:10px;bottom:10px;top:38px;background:linear-gradient(#3A3A44,#24242C);
  border-radius:10px;border:3px solid #6A6A78;display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;}
.oven .heel{position:absolute;left:8px;top:8px;font-size:12px;color:#FFD9A8;font-weight:800;letter-spacing:1px;}
.oven .heat{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(circle at 50% 80%,rgba(255,140,40,.55),transparent 70%);opacity:0;transition:opacity .3s;}
.oven.hot .heat{opacity:1;}
.oven .dial{position:absolute;right:8px;top:6px;width:26px;height:26px;border-radius:50%;
  background:conic-gradient(#FF6B9D 0deg,#FF6B9D var(--dg,0deg),#DDD 0deg);border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.3);}

.dough-item.burnt{filter:grayscale(.55) brightness(.55);}
.progress-ring{position:relative;width:70px;height:70px;}
.gauge{
  width:clamp(46px,9vw,66px);flex:0 0 auto;position:relative;background:#FFFDF7;border:3px solid #D9B892;border-radius:14px;
  height:clamp(110px,20vh,160px);overflow:hidden;box-shadow:inset 0 0 8px rgba(0,0,0,.1);touch-action:none;
}
.gauge .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#FFD98A,#F0A93B);transition:height .06s linear;}
.gauge .fill.tea{background:linear-gradient(#C58A5B,#8B5A2B);}
.gauge .fill.milk{background:linear-gradient(#FFF6E0,#F0DFA8);}
.gauge .zone{position:absolute;left:0;right:0;border-top:2px dashed rgba(46,139,98,.75);border-bottom:2px dashed rgba(46,139,98,.75);

.gauge .tick-l{position:absolute;right:2px;font-size:9px;font-weight:800;color:#8B6543;transform:translateY(-50%);}
.gauge-glow{border-color:#5AE06A;box-shadow:0 0 0 3px rgba(90,224,106,.5),inset 0 0 8px rgba(0,0,0,.1);}
.cup{
  width:clamp(60px,12vw,88px);flex:0 0 auto;position:relative;
  height:clamp(88px,17vh,124px);border:3px solid #E3D6C8;border-top:none;border-radius:6px 6px 22px 22px;

}
.cup .liq{position:absolute;left:0;right:0;bottom:0;transition:height .08s,background .2s;}
.cup .sea{position:absolute;left:0;right:0;height:6px;background:rgba(255,255,255,.6);}

.cup.strawed .straw{opacity:1;}
.cup.shake{animation:shake .16s infinite;}
@keyframes shake{0%,100%{transform:translateX(-4px) rotate(-3deg)}50%{transform:translateX(4px) rotate(3deg)}}
.swipe-hint{font-size:12px;font-weight:800;color:var(--pink-d);background:#FFF0F5;border-radius:10px;padding:5px 12px;animation:bob .9s infinite;}

/* ============ vServe 交付收银 ============ */
.serve-scene{flex:1;display:flex;min-height:0;background:linear-gradient(180deg,#FFF1DE,#FFE0C4);position:relative;}

/* 小偷 */
.thief{

}
@keyframes thiefIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}

.thief .tb.hit{animation:hitShake .2s;}
@keyframes hitShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-8deg)}75%{transform:translateX(7px) rotate(8deg)}}

.thief .thp{width:100%;height:6px;background:rgba(0,0,0,.25);border-radius:4px;overflow:hidden;margin-top:2px;}

.alarm{

}
@keyframes alarmBlink{0%,100%{background:#FF3D3D;box-shadow:0 0 0 4px rgba(255,61,61,.35)}50%{background:#FFD54F;color:#7A4A00;box-shadow:0 0 0 4px rgba(255,213,79,.45)}}
.counter-cash{position:absolute;left:8px;bottom:8px;background:linear-gradient(#F0F0F0,#D4D4D4);border:3px solid #9E9E9E;

.counter-cash.robbed{animation:robbedShake .3s infinite;background:#FFDCDC;border-color:#FF3D3D;color:#C00;}
@keyframes robbedShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* ============ 家园 ============ */
#homeScreen{background:linear-gradient(180deg,#EDE4FF,#F7E9F3);}
.home-top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.7);
  border-bottom:2px solid #E0D2F5;}
.home-top .ht{flex:1;font-size:16px;font-weight:900;color:#6B4C9A;}
.home-main{flex:1;display:flex;min-height:0;gap:8px;padding:8px;}
.room{
  flex:1;position:relative;border-radius:16px;overflow:hidden;min-height:0;

}
.room .wall{position:absolute;left:0;right:0;top:0;height:62%;}

.deco-slot{position:absolute;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;transition:transform .15s;}
.deco-slot:active{transform:scale(.9);}
.deco-slot .d-em{filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));line-height:1;}
.deco-slot.empty{border:2px dashed rgba(0,0,0,.18);border-radius:12px;background:rgba(255,255,255,.4);min-width:44px;min-height:34px;}
.deco-slot.empty::after{content:"+";font-size:20px;color:rgba(0,0,0,.28);font-weight:900;}
.home-side{flex:0 0 auto;width:clamp(150px,26vw,240px);display:flex;flex-direction:column;gap:6px;overflow-y:auto;}
.home-side::-webkit-scrollbar{width:0;}
.slot-card{background:#fff;border-radius:12px;padding:7px 9px;box-shadow:0 3px 8px rgba(0,0,0,.1);}
.slot-card h6{font-size:12px;font-weight:800;color:#6B4C9A;display:flex;align-items:center;gap:4px;}
.slot-card .opts{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
.opt{border:2px solid #E0D2F5;background:#FBF8FF;border-radius:9px;padding:3px 7px;font-size:11px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:3px;}
.opt.own{border-color:#9AE6B4;background:#F0FFF5;}
.opt.eq{border-color:#6B4C9A;background:#EDE4FF;color:#6B4C9A;}
.opt.no{opacity:.5;}
.opt:active{transform:scale(.94);}

/* ============ 弹窗 / 提示 ============ */
.modal-overlay{position:absolute;top:0;right:0;bottom:0;left:0;z-index:200;background:rgba(60,40,50,.55);display:none;
  align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(2px);}
.modal-overlay.show{display:flex;}
.modal-content{
  background:linear-gradient(#FFFDF9,#FFF4EC);border-radius:20px;padding:16px;text-align:center;
  max-width:min(620px,94%);width:100%;max-height:92%;overflow-y:auto;
  box-shadow:0 16px 44px rgba(0,0,0,.35);animation:mIn .24s cubic-bezier(.2,1.3,.5,1);
}
@keyframes mIn{from{transform:scale(.85) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-content::-webkit-scrollbar{width:0;}
.modal-title{font-size:21px;font-weight:900;color:var(--pink-d);margin-bottom:7px;}
.modal-text{font-size:13px;line-height:1.7;color:#6B555C;}
.stars-row{font-size:30px;letter-spacing:5px;margin:6px 0;}
.stars-row .e{opacity:.25;}
.modal-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin:10px 0;}
.shop-item{background:#fff;border:2px solid #FFD9E4;border-radius:14px;padding:8px;cursor:pointer;transition:transform .1s;}
.shop-item:active{transform:scale(.96);}
.shop-item.cant{opacity:.55;filter:grayscale(.4);}
.shop-item .si-e{font-size:30px;}
.shop-item .si-n{font-size:13px;font-weight:800;margin-top:2px;}
.shop-item .si-d{font-size:10px;color:#8B7A80;margin:3px 0;line-height:1.4;}
.shop-item .si-p{font-size:12px;font-weight:900;color:var(--pink-d);background:#FFF0F5;border-radius:8px;padding:2px;}
.outfit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:10px 0;}
.outfit-item{background:#fff;border:2px solid #FFD9E4;border-radius:14px;padding:6px;cursor:pointer;}
.outfit-item.eq{border-color:var(--pink);background:#FFF0F5;box-shadow:0 0 0 3px rgba(255,107,157,.2);}
.outfit-item .oi-p{height:78px;}
.outfit-item .oi-n{font-size:11px;font-weight:800;margin-top:2px;}
.outfit-item .oi-s{font-size:10px;font-weight:800;color:var(--pink-d);}
.lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:10px 0;}
.lvl-btn{aspect-ratio:1;background:linear-gradient(#FFF,#FFF0F5);border:2px solid #FFD9E4;border-radius:14px;
  font-family:inherit;font-size:20px;font-weight:900;color:var(--pink-d);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.lvl-btn:disabled{background:#EEE;color:#BBB;border-color:#DDD;cursor:not-allowed;}
.lvl-btn .ls{font-size:11px;letter-spacing:1px;}
.detail-box{background:#FFFDF5;border:2px dashed #E7B9CA;border-radius:14px;padding:10px;margin:8px 0;text-align:left;}
.detail-box h4{font-size:12px;color:#A5737F;letter-spacing:2px;margin-bottom:5px;}
.detail-box .d-row{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:4px 2px;border-bottom:1px dotted #F0DCE4;}
.detail-box .d-row:last-child{border:none;}
.detail-box .d-row .de{font-size:18px;width:24px;text-align:center;}
.detail-box .d-row .dq{margin-left:auto;font-size:11px;color:#A5737F;}

/* Toast */
#toastBox{position:absolute;left:0;right:0;top:calc(var(--topH) + 4px);z-index:300;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:5px;}
.toast{background:rgba(60,44,50,.9);color:#fff;font-size:13px;font-weight:800;padding:7px 16px;border-radius:999px;
  animation:tIn .25s;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90%;text-align:center;}
.toast.good{background:linear-gradient(#68D391,#38A169);}
.toast.bad{background:linear-gradient(#FC8181,#E53E3E);}
.toast.warn{background:linear-gradient(#F6AD55,#DD6B20);}
@keyframes tIn{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}

/* 场景遮罩：倒计时/暂停 */
.scene-overlay{position:absolute;top:0;right:0;bottom:0;left:0;z-index:250;background:rgba(255,240,246,.9);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;}
.scene-overlay.show{display:flex;}
.cd-num{font-size:78px;font-weight:900;color:var(--pink-d);animation:cdPop .5s;}
@keyframes cdPop{from{transform:scale(1.7);opacity:0}to{transform:none;opacity:1}}
.scene-overlay .hint{font-size:14px;font-weight:700;color:#8B7A80;}

/* 教程层 */
#tutLayer{position:absolute;top:0;right:0;bottom:0;left:0;z-index:280;pointer-events:none;display:none;}
#tutLayer.on{display:block;}
#tutLayer .spot{position:absolute;border-radius:16px;box-shadow:0 0 0 3000px rgba(30,12,20,.55),0 0 0 3px #FFD54F inset;
  animation:spotPulse 1.5s infinite;pointer-events:none;}
@keyframes spotPulse{0%,100%{box-shadow:0 0 0 3000px rgba(30,12,20,.55),0 0 0 3px #FFD54F inset}
  50%{box-shadow:0 0 0 3000px rgba(30,12,20,.55),0 0 0 5px #FF6B9D inset}}
.tut-box{
  position:absolute;pointer-events:auto;background:linear-gradient(#FFFDF9,#FFF0F5);border:3px solid #FFD54F;
  border-radius:16px;padding:11px 14px;max-width:min(340px,84%);box-shadow:0 10px 28px rgba(0,0,0,.3);
  animation:tIn .25s;
}
.tut-box .tt{font-size:14px;font-weight:900;color:var(--pink-d);display:flex;align-items:center;gap:6px;}
.tut-box .tb{font-size:12.5px;line-height:1.7;color:#5C4953;margin-top:4px;}
.tut-box .tf{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tut-box .step{font-size:11px;color:#A5737F;font-weight:800;}
.tut-box .skip{font-size:11px;color:#A5737F;text-decoration:underline;cursor:pointer;font-weight:700;}
.tut-box .ok{font-size:12px;padding:5px 14px;}
#tutLayer .tut-arrow{position:absolute;font-size:24px;line-height:1;pointer-events:none;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));animation:tutBob .8s ease-in-out infinite;z-index:5;}
@keyframes tutBob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}

/* 特效层 */
#fxLayer{position:absolute;top:0;right:0;bottom:0;left:0;z-index:290;pointer-events:none;overflow:hidden;}
.coin-fx{position:absolute;font-size:26px;animation:coinUp 1.1s forwards;}
@keyframes coinUp{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-90px) scale(1.25);opacity:0}}
.float-tx{position:absolute;font-size:19px;font-weight:900;animation:coinUp 1.2s forwards;text-shadow:0 2px 5px rgba(0,0,0,.25);}
.bell-fx{position:absolute;font-size:24px;animation:coinUp 1s forwards;}
.small-note{font-size:11px;opacity:.75;}

/* 矮屏紧凑 */
@media (max-height:520px){
  :root{--topH:44px;--tabH:46px;--railH:66px;--fs:14px;}
  .tick{width:58px;}
  .order-banner{padding:3px 18px;font-size:13px;letter-spacing:2px;}
  .comic-frame{height:min(300px,88%);}
  #menuChar{height:110px;}
  .btn{padding:7px 14px;}
  .ing{min-width:46px;padding:2px 4px;}
  .ing .ie{font-size:16px;}
  .dough{width:78px;}
  .pad-stage{padding:20px 0 38px;}
  .keypad .pkey{padding:4px 0;font-size:15px;}
}
@media (max-width:640px){
  .mini-recipe{width:88px;}
  .cash-panel{width:150px;}
}
</style>

<body>
<div id="stage">

    <button class="btn" onclick="this.parentNode.style.display='none'">知道了，竖屏也能看</button>
  </div>

  <!-- ===== 开场漫画 ===== -->
  <div class="screen" id="comicScreen">

  <!-- ===== 主菜单 ===== -->

  <div class="screen" id="homeScreen">

  <!-- ===== 游戏 ===== -->
  <div class="screen" id="gameRoot">

function fatal(err){
  try{
    const msg = (err && (err.message || err.reason || err.stack)) || String(err);
    let box = document.getElementById('fatalBox');
    if(!box){
      box = document.createElement('div');
      box.id = 'fatalBox';
      box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;'+
        'background:#D6336C;color:#fff;font:12px/1.6 Consolas,monospace;padding:10px 14px;'+
        'white-space:pre-wrap;max-height:45vh;overflow:auto;cursor:pointer';
      box.title = '点击关闭';
      box.onclick = ()=>{ box.style.display = 'none'; };
      (document.body || document.documentElement).appendChild(box);
    }
    box.style.display = 'block';
    box.textContent = '⚠️ 游戏出错了，把这段截图发给我就能修：\n' + msg;
  }catch(e){}
}
window.addEventListener('error', function(ev){ fatal(ev.error || ev.message); });
window.addEventListener('unhandledrejection', function(ev){ fatal(ev.reason); });

/* ================= 音效 ================= */
let actx = null;
function audio(){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
  }catch(e){ actx = null; }
  return actx;
}
function tone(f,d,type,vol,delay){
  if(!state || !state.soundOn) return;
  const c = audio(); if(!c) return;
  const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||.1, t0+.02);
  g.gain.exponentialRampToValueAtTime(.0001, t0+d);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+d+.05);
}
function noise(dur, vol){
  if(!state || !state.soundOn) return;
  const c = audio(); if(!c) return;
  const len = Math.floor(c.sampleRate*Math.min(.35,dur));
  const buf = c.createBuffer(1, len, c.sampleRate);
  const dat = buf.getChannelData(0);
  for(let i=0;i<len;i++) dat[i] = (Math.random()*2-1) * (1 - i/len);
  const src = c.createBufferSource(); src.buffer = buf;
  const g = c.createGain(); g.gain.value = vol||.08;
  const f = c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start();
}

function modal(opts){
  const ov = $('modalOverlay');
  ov.innerHTML = '';
  const c = mkEl('div','modal-content');
  if(opts.title) c.appendChild(mkEl('div','modal-title',opts.title));
  if(opts.html)  c.appendChild(mkEl('div','modal-text',opts.html));
  if(opts.node)  c.appendChild(opts.node);
  if(opts.stars!=null){
    c.appendChild(mkEl('div','stars-row',[1,2,3].map(i=>'<span class="'+(i<=opts.stars?'':'e')+'">⭐</span>').join('')));
  }
  if(opts.buttons){
    const row = mkEl('div','modal-btns');
    opts.buttons.forEach((b,i)=>{
      const btn = mkEl('button','btn'+(i?' secondary':'')+(b.danger?' danger':''),b.text);
      btn.onclick = ()=>{ ov.classList.remove('show'); if(b.action) b.action(); };
      row.appendChild(btn);
    });
    c.appendChild(row);
  }
  ov.appendChild(c);
  ov.classList.add('show');
  return c;
}

/* ================= 手势引擎 ================= */
// 通用拖拽：payload + 影子元素
function bindDrag(el, payload, opts){
  opts = opts || {};
  let g = null, sx = 0, sy = 0, moved = false;
  el.addEventListener('pointerdown', e=>{
    if(!canPlay()) return;
    if(e.button != null && e.button !== 0 && e.pointerType === 'mouse') return;
    e.preventDefault(); e.stopPropagation();
    sx = e.clientX; sy = e.clientY; moved = false;
    const move = ev=>{
      const x = ev.clientX, y = ev.clientY;
      if(!moved && Math.hypot(x-sx,y-sy) > 6){
        moved = true;
        g = mkEl('div','drag-ghost', opts.ghost || payload.ghost || '🍰');
        document.body.appendChild(g);
      }
      if(g){ g.style.left = x+'px'; g.style.top = y+'px'; }
    };
    const up = ev=>{
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      if(g){ g.remove(); g = null; }
      if(opts.onEnd) opts.onEnd(ev.clientX, ev.clientY, moved);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
    if(opts.onDown) opts.onDown();
  });
}
// 按住蓄力 / 计时：持续回调
function bindHold(el, opts){
  let on = false, t0 = 0, raf = 0;
  const stop = ()=>{ if(!on) return; on=false; cancelAnimationFrame(raf); if(opts.onEnd) opts.onEnd(); };
  el.addEventListener('pointerdown', e=>{
    if(!canPlay()) return;
    e.preventDefault(); e.stopPropagation();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    on = true; t0 = performance.now();
    const loop = ()=>{ if(!on) return; opts.onTick((performance.now()-t0)/1000); raf = requestAnimationFrame(loop); };
    loop();
  });
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
  el.addEventListener('pointerleave', stop);
}
// 涂抹：把画布上的格子按指针半径抹亮
function bindSmear(el, getCells, onCell, opts){
  opts = opts || {};
  let on = false;
  const at = e=>{
    if(!on || !canPlay()) return;
    const r = el.getBoundingClientRect();
    if(!r.width) return;
    const x = e.clientX - r.left, y = e.clientY - r.top;
    let did = false;
    getCells().forEach((c,i)=>{
      const cx = c.x + c.w/2, cy = c.y + c.h/2;
      if(Math.hypot(cx-x, cy-y) < (opts.radius||26)){ if(onCell(i)) did = true; }
    });
    if(did && opts.onChange) opts.onChange();
  };
  el.addEventListener('pointerdown', e=>{
    if(!canPlay()) return;
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    on = true; at(e);
  });
  el.addEventListener('pointermove', at);
  const stop = ()=>{ on = false; };
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
  el.addEventListener('pointerleave', stop);
}
// 滑动：累计横向来回次数
function bindSwipe(el, opts){
  let lastX = null, dir = 0, n = 0;
  let down = false;
  el.addEventListener('pointerdown', e=>{
    if(!canPlay()) return;
    e.preventDefault(); down = true; lastX = e.clientX;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });
  el.addEventListener('pointermove', e=>{
    if(!down) return;
    const dx = e.clientX - lastX;
    if(Math.abs(dx) < 12) return;
    const d = dx > 0 ? 1 : -1;
    if(d !== dir){ dir = d; n++; if(opts.onStep) opts.onStep(n); SFX.swipe(); }
    lastX = e.clientX;
  });
  const up = ()=>{ down = false; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
}
// 画圈揉面：累计角度
function bindCircle(el, opts){
  let ang = null, total = 0, down = false, lastT = 0;
  el.addEventListener('pointerdown', e=>{
    if(!canPlay()) return;
    e.preventDefault(); down = true; ang = null; lastT = performance.now();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });
  el.addEventListener('pointermove', e=>{
    if(!down) return;
    const r = el.getBoundingClientRect();
    const x = e.clientX - (r.left + r.width/2);
    const y = e.clientY - (r.top + r.height/2);
    if(Math.hypot(x,y) < r.width * .18) return;
    const a = Math.atan2(y,x);
    if(ang !== null){
      let d = a - ang;
      while(d >  Math.PI) d -= Math.PI*2;
      while(d < -Math.PI) d += Math.PI*2;
      total += d;
      const now = performance.now();
      if(now - lastT > 110){
        lastT = now;
        const turns = Math.abs(total)/(Math.PI*2);
        if(opts.onTurn) opts.onTurn(turns);
        SFX.knead();
      }
    }
    ang = a;
  });
  const up = ()=>{ down = false; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
}
function canPlay(){
  const ov = $('modalOverlay');
  return state.running && state.phase==='playing' && !state.paused &&
         (!ov || !ov.classList.contains('show'));
}

function genOrder(kind, cx){
  if(kind === 'cake'){
    const layers = cx >= 3 ? rint(1,3) : (cx >= 2 ? rint(1,2) : 1);
    let topping;
    if(cx <= 1) topping = chance(.55) ? CAKE_T[4] : pick(CAKE_T.slice(0,3));
    else topping = pick(CAKE_T);
    return {
      kind:'cake', layers:layers, flavor:pick(CAKE_F),
      filling: cx >= 2 ? pick(CAKE_G) : CAKE_G[0],
      topping: topping
    };
  }
  if(kind === 'bread'){
    return {
      kind:'bread', dough:pick(BREAD_D),
      addin: cx >= 2 ? pick(BREAD_A) : (chance(.5) ? BREAD_A[3] : pick(BREAD_A.slice(0,3))),
      bake:  cx >= 2 ? pick(BREAD_B) : BREAD_B[1],
      butter: cx >= 3
    };
  }
  const m = cx >= 2 ? pick(TEA_M) : TEA_M[1];
  const ap = cx >= 3 ? pick(TEA_P) : pick([TEA_P[0],TEA_P[1],TEA_P[3]]);
  const cnt = ap.id === 'none' ? 0 : (cx >= 2 ? rint(1,3)*2 : 2);
  return {
    kind:'tea', base:pick(TEA_B), milk:m, addin:ap, pearls:cnt,
    sweet: cx >= 2 ? pick(TEA_S) : TEA_S[1]
  };
}
function ticketPrice(spec){
  if(spec.kind === 'cake')  return 18 + spec.layers*8;
  if(spec.kind === 'bread') return 16 + (spec.addin.id!=='none'?4:0) + (spec.bake.id==='dark'?4:0);
  const mi = TEA_M.findIndex(m=>m.id===spec.milk.id);
  return 14 + mi*3 + spec.pearls*1.5;
}
let _tid = 0, _cid = 0;
function newTicket(spec, cid){
  const price = Math.round(ticketPrice(spec) * payMult());
  const t = {
    tid:++_tid, no:_tid, cid:cid, spec:spec, price:price,
    status:'open', wip:emptyWip(spec.kind), startedAt:Date.now()
  };
  state.tickets.push(t);
  return t;
}
function emptyWip(kind){
  if(kind === 'cake')  return {layers:[], filling:null, frost:null, tops:[]};
  if(kind === 'bread') return {dough:null, knead:0, addin:null, prove:0, bakeVal:0, baking:false, butters:null, packed:false};
  return {base:null, water:0, milk:0, addin:null, pearls:[], shake:0, sweet:0, sealed:false, straw:false};
}
function ticketOf(id){ return state.tickets.find(t=>t.tid===id); }
function liveTickets(){ return state.tickets.filter(t=>t.status!=='done' && t.status!=='void'); }

/* ================= 顾客 ================= */
const C_NAMES = ['阿桃','糖糖','果冻','布丁','奶昔','豆豆','可可','糯米','雪梨','奶茶','花卷','大熊','莉莉','小麦','南瓜','柚子'];
const C_FACES = ['👧','👩','🧒','👵','👨','🧓','👱‍♀️','👲','🧑','👩‍🦰','👨‍🦱','🧕','👼','🤠','👩‍🎤','👨‍🍳'];
function spawnCustomer(){
  const L = levelCfg(state.level);
  if(state.custs.length >= L.maxQ) return null;
  const pat = L.pat + (state.buffs.heal ? 10 : 0) + perkVal('desk');
  const c = { cid:++_cid, name:pick(C_NAMES), face:pick(C_FACES), pat:pat, max:pat, taken:false };
  state.custs.push(c);
  if(state.tab === 'order') fx($('custQueue'),'bell-fx','🔔');
  return c;
}
function renderQueue(){
  const q = $('custQueue');
  if(!q) return;
  const alive = {};
  state.custs.forEach(c=>{
    alive[c.cid] = true;
    let el = q.querySelector('[data-cid="'+c.cid+'"]');
    if(!el){
      el = mkEl('div','cust');
      el.dataset.cid = c.cid;
      el.innerHTML = '<div class="cb">'+c.face+'</div><div class="nm">'+c.name+'</div><div class="pb"><div class="pf"></div></div>';
      el.onclick = ()=>takeOrder(c.cid);
      q.appendChild(el);
    }
    const t = ticketOf2(c.cid);
    const ready = t && t.status === 'ready';
    el.classList.toggle('head', ready);
    el.classList.toggle('thinking', !c.taken);
  });
  Array.prototype.slice.call(q.children).forEach(el=>{
    if(!alive[Number(el.dataset.cid)] && !el.classList.contains('leaving')) el.remove();
  });
  const emptyNow = q.querySelector('.empty-q');
  if(!state.custs.length){ if(!emptyNow) q.appendChild(mkEl('div','empty-q','🕰️ 暂时没有客人，擦擦柜台等等吧')); }
  else if(emptyNow) emptyNow.remove();
  updatePatBars();
  $('orderHint').innerHTML = state.custs.some(c=>!c.taken)
    ? '👆 点一下还没点单的客人，接下订单'
    : (state.tickets.some(t=>t.status==='ready') ? '🙋 有成品做好了！去「出餐收银」交给客人' : '☕ 客人在等自己的甜品…');
}
function ticketOf2(cid){
  for(let i=state.tickets.length-1;i>=0;i--){
    const t = state.tickets[i];
    if(t.cid === cid && t.status !== 'void' && t.status !== 'done') return t;
  }
  return null;
}
function updatePatBars(){
  const q = $('custQueue'); if(!q) return;
  state.custs.forEach(c=>{
    const el = q.querySelector('[data-cid="'+c.cid+'"]'); if(!el) return;
    const f = el.querySelector('.pf'); if(!f) return;
    const p = Math.max(0, c.pat / c.max * 100);
    f.style.width = p + '%';
    f.className = 'pf' + (p < 28 ? ' crit' : (p < 55 ? ' low' : ''));
  });
}
function takeOrder(cid){
  if(!canPlay()) return;
  const c = state.custs.find(x=>x.cid===cid);
  if(!c || c.taken) return;
  const L = levelCfg(state.level);
  const kind = pick(L.kinds);
  const spec = genOrder(kind, L.complex);
  const t = newTicket(spec, cid);
  c.taken = true;
  SFX.ding(); SFX.select();
  sayTo(cid, orderLines(spec).slice(0,2).map(x=>x[1]).join(' · '));
  toast('🧾 接下订单 #'+t.no+'（'+PROD[kind].name+' $'+t.price+'）→ 去「🔥 后厨制作」开工');
  checkTutorials('takeorder');
  renderQueue(); renderRail();
  // 后厨空着就先把小票放上台面（不自动切工位，交给玩家自己走过去）
  setTimeout(()=>{
    if(!state.running) return;
    if(!state.buildId) loadBuild(t.tid); else renderRail();
  }, 500);
}
function sayTo(cid, txt){
  const q = $('custQueue'); if(!q) return;
  const el = q.querySelector('[data-cid="'+cid+'"]'); if(!el) return;
  const s = mkEl('div','say', '🗣 '+txt);
  el.appendChild(s);
  setTimeout(()=>s.remove(), 2600);
}
function orderLines(spec){
  if(spec.kind === 'cake'){
    return [
      ['🍰', spec.flavor.emoji+' '+spec.flavor.name+'口味'],
      ['📶', spec.layers + ' 层'],
      ['🥄', '夹心：'+spec.filling.name],
      ['🌸', spec.topping.id==='none' ? '不要装饰' : '装饰：'+spec.topping.name]
    ];
  }
  if(spec.kind === 'bread'){
    return [
      ['🥖', spec.dough.name+'面团'],
      ['🍇', spec.addin.id==='none' ? '不用加料' : '加料：'+spec.addin.name],
      ['🔥', '烘烤：'+spec.bake.name],
      ['🧈', spec.butter ? '要刷一层黄油' : '不用刷酱']
    ];
  }
  return [
    ['🍵', spec.base.name+'茶底'],
    ['🥛', spec.milk.name],
    ['⚫', spec.addin.id==='none' ? '不用加料' : spec.addin.name+' ×'+spec.pearls],
    ['🍬', spec.sweet.name]
  ];
}
function dropCustomer(c, angry){
  const q = $('custQueue');
  const el = q && q.querySelector('[data-cid="'+c.cid+'"]');
  if(el){ el.classList.add('leaving'); setTimeout(()=>el.remove(), 460); }
  const t = state.tickets.find(x=>x.cid===c.cid && x.status!=='done' && x.status!=='void');
  if(t){
    t.status = 'void';
    if(state.buildId === t.tid) state.buildId = null;
    if(state.finishId === t.tid) state.finishId = null;
    state.tray = state.tray.filter(x=>x.tid !== t.tid);
  }
  state.custs = state.custs.filter(x=>x.cid !== c.cid);
  state.lost++; state.combo = 0;
  const pen = 6;
  state.money = Math.max(0, state.money - pen);
  state.totalMoney = Math.max(0, state.totalMoney - pen);
  SFX.lose();
  toast('😡 '+c.name+' 等不及走了 −$'+pen, 'bad');
  fx(null,'float-tx','😡');
  updateTop(); renderRail();
  if(state.tab==='serve') renderServe();
  setTimeout(renderQueue, 220);
}

/* ================= 关卡 ================= */
function startLevel(id){
  const L = levelCfg(id);
  stopAll();
  state.level = id;
  state.money = 0;
  state.timeLeft = L.time + perkVal('bed');
  state.target = L.target;
  state.custs = []; state.tickets = []; state.tray = [];
  state.buildId = null; state.finishId = null;
  state.combo = 0; state.maxCombo = 0; state.served = 0; state.lost = 0;
  state.history = []; state.thief = null; state.registerCash = 0;
  state.paused = false; state.phase = 'countdown'; state.running = true;
  state.buffs = {};
  closeModal(); clearThief(true);
  showScreen('gameRoot');
  buildTabs();
  state.tab = null;
  gotoTab('order');
  renderQueue(); renderRail(); updateTop();
  countdown(()=>{
    state.phase = 'playing';
    const first = Math.min(2, L.maxQ);
    for(let i=0;i<first;i++) spawnCustomer();
    renderQueue(); SFX.bell();
    startTimers();
    checkTutorials('start');
  });
  const boost = Object.keys(state.ownedItems).filter(k=>state.ownedItems[k]>0);
  if(boost.length) setTimeout(()=>maybeItem(()=>{}), 80);
}
function startTimers(){
  clearInterval(state.timers.main);
  let lastTick = -1;
  state.timers.main = setInterval(()=>{
    if(state.paused || state.phase !== 'playing') return;
    // 教程进行中：营业时间同样冻结，玩家慢慢学
    if(!state.tutorial) state.timeLeft -= .1;
    if(state.timeLeft <= 0){ state.timeLeft = 0; updateTop(); endLevel(false); return; }
    const s = Math.ceil(state.timeLeft);
    if(s <= 10 && s !== lastTick){ lastTick = s; SFX.tick(); }
    updateTop();
  }, 100);
  clearInterval(state.timers.cust);
  state.timers.cust = setInterval(()=>{
    if(state.paused || state.phase !== 'playing') return;
    const L = levelCfg(state.level);
    const drain = (state.buffs.slow ? .5 : 1) * L.drain;
    const gone = [];
    // 教程进行中：冻结顾客耐心（不扣、不气走）
    state.custs.forEach(c=>{ if(!state.tutorial) c.pat -= .1 * drain; if(c.pat <= 0) gone.push(c); });
    gone.forEach(c=>dropCustomer(c));
    updatePatBars();
    maybeThief(L);
  }, 100);
  clearInterval(state.timers.spawn);
  state.timers.spawn = setInterval(()=>{
    if(state.paused || state.phase !== 'playing') return;
    if(spawnCustomer()){ renderQueue(); SFX.bell(); }
  }, Math.max(1200, levelCfg(state.level).gap * 1000 * (1 - Math.min(.5, perkVal('wall')))));
}
function stopAll(){
  clearInterval(state.timers.main); clearInterval(state.timers.cust);
  clearInterval(state.timers.spawn); clearTimeout(state.timers.cd);
  clearTimeout(state.timers.thiefT);
  state.timers = {};
}
function countdown(done){
  const ov = $('sceneOverlay');
  ov.innerHTML = '';
  ov.classList.add('show');
  let n = 3;
  const step = ()=>{
    if(!state.running){ ov.classList.remove('show'); return; }
    if(n > 0){
      ov.innerHTML = '<div class="cd-num">'+n+'</div><div class="hint">准备开工…</div>';
      SFX.tick(); n--;
      state.timers.cd = setTimeout(step, 700);
    }else{
      ov.innerHTML = '<div class="cd-num" style="font-size:74px">GO!</div>';
      SFX.go();
      state.timers.cd = setTimeout(()=>{ ov.classList.remove('show'); if(done) done(); }, 520);
    }
  };
  step();
}
function hideOverlay(){ $('sceneOverlay').classList.remove('show'); }
let autoPauseOff = false;
function autoPause(){ if(state.running && state.phase==='playing' && !state.paused){ togglePause(); autoPauseOff = true; } }
function closeAutoPanel(){ closeModal(); if(autoPauseOff && state.paused){ autoPauseOff = false; togglePause(); } }
function togglePause(){
  if(!state.running || (state.phase !== 'playing' && !state.paused)) return;
  state.paused = !state.paused;
  const ov = $('sceneOverlay');
  if(state.paused){
    ov.innerHTML = '';
    ov.classList.add('show');
    ov.appendChild(mkEl('div','cd-num','⏸'));
    ov.appendChild(mkEl('div','hint','已暂停 · 计时和客人的耐心都停住了'));
    const row = mkEl('div','modal-btns');
    const b1 = mkEl('button','btn','▶ 继续营业'); b1.onclick = togglePause;
    const b2 = mkEl('button','btn secondary','🏠 返回菜单'); b2.onclick = ()=>{ autoPauseOff=false; openMenu(); };
    row.appendChild(b1); row.appendChild(b2);
    ov.appendChild(row);
    $('pauseIco').textContent = '▶';
  }else{
    ov.classList.remove('show');
    $('pauseIco').textContent = '⏸';
  }
  SFX.tap();
}
function confirmQuit(){
  if(!state.running){ openMenu(); return; }
  autoPause();
  confirmDlg({
    title:'🏠 收工回菜单？', text:'本关进度会作废，<b>已经赚到的金币照常保留</b>。',
    yes:'收工', no:'继续营业',
    onYes:()=>{ autoPauseOff=false; openMenu(); },
    onNo:()=>closeAutoPanel()
  });
}
function endLevel(win){
  state.running = false; state.phase = 'over';
  stopAll(); hideOverlay(); clearThief(true);
  const total = state.served;
  const perfect = state.history.filter(h=>h.pct >= .95).length;
  const avg = total ? Math.round(state.history.reduce((a,h)=>a+h.pct,0)/total*100) : 0;
  const line = '服务 <b>'+total+'</b> 位 · 完美 <b>'+perfect+'</b> 单 · 平均得分 <b>'+avg+'%</b><br>' +
               '🔥 最高连击 '+state.maxCombo+' · 😡 流失 '+state.lost+' 位';
  if(win){
    SFX.win();
    const stars = calculateStars();
    const prev = state.levelStars[state.level] || 0;
    if(stars > prev) state.levelStars[state.level] = stars;
    if(state.level >= state.unlocked && state.level < LEVELS.length) state.unlocked = state.level + 1;
    save();
    const nextId = state.level + 1;
    const unlockMsg = unlockNote(nextId);
    modal({
      title:'🎉 今日营业额达成！',
      html:'收入 <b>$'+state.money+'</b> / 目标 <b>$'+state.target+'</b><br>'+line+
           (unlockMsg ? '<br><br><span style="color:#D6336C;font-weight:800">'+unlockMsg+'</span>' : ''),
      stars:stars,
      buttons: nextId <= LEVELS.length ? [
        {text:'▶ 进入第 '+nextId+' 关', action:()=>maybeItem(()=>startLevel(nextId))},
        {text:'🔄 再玩一次', action:()=>maybeItem(()=>startLevel(state.level))},
        {text:'🏠 回菜单', action:openMenu}
      ] : [{text:'🏠 回菜单', action:openMenu}]
    });
  }else{
    SFX.lose(); save();
    modal({
      title:'⏰ 打烊啦',
      html:'今天只赚到 <b>$'+state.money+'</b>，还差 <b>$'+(state.target-state.money)+'</b><br>'+line+
           '<br><span class="small-note">小提示：先接单再动手，手上的半成品做完就立刻交出去，别让客人干等。</span>',
      buttons:[
        {text:'🔄 再试一次', action:()=>maybeItem(()=>startLevel(state.level))},
        {text:'🏠 回菜单', action:openMenu}
      ]
    });
  }
}
function calculateStars(){
  const total = state.history.length;
  if(!total) return 1;
  const avg = state.history.reduce((a,h)=>a+h.pct,0) / total;
  const perfect = state.history.filter(h=>h.pct>=.95).length;
  if(avg >= .9 && perfect >= Math.max(2, Math.ceil(total*.6))) return 3;
  if(avg >= .65) return 2;
  return 1;
}
function unlockNote(nextId){
  if(nextId > LEVELS.length) return '';
  const L = levelCfg(nextId), prev = levelCfg(nextId-1);
  const notes = [];
  (L.kinds||[]).forEach(k=>{ if(!prev.kinds.includes(k)) notes.push('🥳 解锁新品类：'+PROD[k].name); });
  if(nextId === 4) notes.push('💵 新玩法：自己收钱找零');
  if(nextId === 6) notes.push('🥷 当心：小偷开始出没了');
  return notes.join('　/　');
}
function maybeItem(then){
  const ids = Object.keys(state.ownedItems).filter(k=>state.ownedItems[k] > 0);
  if(!ids.length){ if(then) then(); return; }
  const box = mkEl('div','shop-grid');
  ITEMS.forEach(it=>{
    const own = state.ownedItems[it.id] || 0;
    if(!own) return;
    const d = mkEl('div','shop-item','<div class="si-e">'+it.emoji+'</div><div class="si-n">'+it.name+' <small>×'+own+'</small></div>'+
      '<div class="si-d">'+it.desc+'</div><div class="si-p">用掉一个</div>');
    d.onclick = ()=>{
      applyBuff(it.id);
      state.ownedItems[it.id]--;
      if(state.ownedItems[it.id] <= 0) delete state.ownedItems[it.id];
      save(); closeModal(); if(then) then();
    };
    box.appendChild(d);
  });
  modal({title:'🎒 要带个道具上班吗？', html:'选一个在本关生效（库存有限，用完就没了）',
    node:box, buttons:[{text:'⏭ 不用了', action:then}]});
}
function applyBuff(id){
  if(id === 'heal') state.custs.forEach(c=>{ c.pat += 10; c.max += 10; });
  state.buffs[id] = true;
  const it = ITEMS.find(x=>x.id===id);
  toast(it.emoji+' '+it.name+' 已生效','good');
  SFX.buy(); updateTop();
}
function openBag(){
  autoPause();
  const box = mkEl('div','shop-grid');
  ITEMS.forEach(it=>{
    const own = state.ownedItems[it.id] || 0;
    const can = state.totalMoney >= it.price;
    const d = mkEl('div','shop-item'+(can?'':' cant'),
      '<div class="si-e">'+it.emoji+'</div><div class="si-n">'+it.name+(own?' <small>×'+own+'</small>':'')+'</div>'+
      '<div class="si-d">'+it.desc+'</div><div class="si-p">'+(can?'立刻买下 $'+it.price:'金币不足 $'+it.price)+'</div>');
    d.onclick = ()=>{
      if(!can){ toast('金币不足','bad'); SFX.tap(); return; }
      state.totalMoney -= it.price;
      state.ownedItems[it.id] = own + 1;
      save(); SFX.buy(); toast('买下 '+it.name,'good'); updateTop();
      closeAutoPanel(); if(state.running) setTimeout(openBag, 40);
    };
    box.appendChild(d);
  });
  modal({
    title:'🎒 道具口袋',
    html:'💰 我的金币 <b>$'+state.totalMoney+'</b>　|　下一关开始时会问你要不要带上' +
         (Object.keys(state.buffs).length ? '<br><span class="tag">本关已生效</span> '+Object.keys(state.buffs).map(k=>ITEMS.find(x=>x.id===k).emoji+ITEMS.find(x=>x.id===k).name).join('　') : ''),
    node:box, buttons:[{text:'关闭', action:closeAutoPanel}]

function openLevels(){

function quickStart(){

/* ================= 成品预渲染 ================= */
function cakeLayers(t){
  return t.wip.layers.map(l=>CAKE_F.find(f=>f.id===l)).filter(Boolean);
}
function madeSVG(t, size){
  if(t.spec.kind === 'cake'){
    const ls = cakeLayers(t);
    const n = ls.length || 1;
    let s = '<svg viewBox="0 0 100 120" style="width:'+(size||34)+'px;height:auto">';
    for(let i=0;i<n;i++){
      const f = ls[i] || CAKE_F[0];
      const w = 76 - i*8, x = (100-w)/2, y = 96 - (n-i)*20;
      s += '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="20" rx="5" fill="'+f.color+'" stroke="'+f.border+'" stroke-width="2"/>';
      if(t.wip.filling && i < n-1){
        const g = CAKE_G.find(x2=>x2.id===t.wip.filling) || CAKE_G[0];
        s += '<rect x="'+(x+5)+'" y="'+(y-2)+'" width="'+(w-10)+'" height="4" rx="2" fill="'+g.color+'"/>';
      }
    }
    const covered = frostPct(t) >= .999;
    if(covered) s += '<rect x="14" y="'+(96-n*20)+'" width="72" height="'+(n*20)+'" rx="8" fill="none" stroke="#FFF0F5" stroke-width="2" opacity=".9"/>';
    (t.wip.tops||[]).slice(0,5).forEach((tp,i)=>{
      s += '<text x="'+(30+i*10)+'" y="'+(96-n*20-2)+'" font-size="13" text-anchor="middle">'+(CAKE_T.find(x3=>x3.id===tp.type)||CAKE_T[0]).emoji+'</text>';
    });
    s += '<ellipse cx="50" cy="104" rx="42" ry="7" fill="#E9E0D8"/>';
    return s+'</svg>';
  }
  if(t.spec.kind === 'bread'){
    const d = t.wip.dough ? BREAD_D.find(x4=>x4.id===t.wip.dough) : null;
    const bk = t.wip.bakeVal || 0;
    const col = (d ? d.color : '#D9B67F');
    let s = '<svg viewBox="0 0 100 120" style="width:'+(size||34)+'px;height:auto">';
    s += '<ellipse cx="50" cy="106" rx="40" ry="6" fill="#E4D3BE"/>';
    s += '<path d="M16,96 Q14,52 50,48 Q86,52 84,96 Q50,104 16,96 Z" fill="'+col+'" stroke="'+((d&&d.border)||'#C79E69')+'" stroke-width="2.5"/>';
    s += '<path d="M26,60 Q34,54 44,60" stroke="#fff" stroke-width="2.5" fill="none" opacity=".5"/>';
    s += '<path d="M52,72 Q62,66 72,72" stroke="#fff" stroke-width="2.5" fill="none" opacity=".5"/>';
    if(t.wip.addin && t.wip.addin !== 'none'){
      const a = BREAD_A.find(x5=>x5.id===t.wip.addin) || BREAD_A[0];
      [26,44,62].forEach(px=>{ s += '<text x="'+px+'" y="86" font-size="10">'+a.emoji+'</text>'; });
    }
    if(bk) s += '<text x="50" y="42" font-size="14" text-anchor="middle">'+((BREAD_B.find(x6=>x6.id===t.wip.bakeTarget)||BREAD_B[1]).emoji)+'</text>';
    if(t.wip.packed) s += '<rect x="12" y="46" width="76" height="58" rx="6" fill="#F6E7D2" stroke="#D9B892" stroke-width="2"/><text x="50" y="80" font-size="14" text-anchor="middle">🏷️</text>';
    return s+'</svg>';
  }
  const base = t.wip.base ? TEA_B.find(x7=>x7.id===t.wip.base) : null;
  const mi = Math.round((t.wip.milk||0)/100*46);
  let s = '<svg viewBox="0 0 100 120" style="width:'+(size||34)+'px;height:auto">';
  s += '<path d="M22,40 L28,108 Q50,116 72,108 L78,40 Z" fill="#FFFFFF" stroke="#E3D6C8" stroke-width="2.5"/>';
  if(base) s += '<rect x="24" y="'+(104-mi)+'" width="52" height="'+Math.max(4,mi)+'" fill="'+base.color+'" opacity=".85"/>';
  if((t.wip.milk||0) > 0) s += '<rect x="24" y="'+(104-mi)+'" width="52" height="'+Math.min(10,mi)+'" fill="#FFF6E0" opacity=".75"/>';
  (t.wip.pearls||[]).slice(0,8).forEach((p,i)=>{
    s += '<circle cx="'+(32+(i%3)*13)+'" cy="'+(100-Math.floor(i/3)*9)+'" r="4.5" fill="'+((TEA_P.find(x8=>x8.id===p)||TEA_P[0]).color)+'"/>';
  });
  if(t.wip.sealed) s += '<rect x="19" y="32" width="62" height="10" rx="4" fill="#B98055"/>';
  if(t.wip.straw)  s += '<rect x="56" y="8" width="6" height="30" rx="3" fill="#FF6B9D" transform="rotate(12 59 23)"/>';
  s += '<ellipse cx="50" cy="114" rx="34" ry="5" fill="#E4D3BE"/>';
  return s+'</svg>';
}
function frostPct(t){
  const f = t.wip.frost;
  if(!f || !f.length) return 0;
  return f.filter(Boolean).length / f.length;
}
function butterPct(t){
  const f = t.wip.butters;
  if(!f || !f.length) return 0;
  return f.filter(Boolean).length / f.length;
}

/* ================= 后厨 ================= */
function loadBuild(tid){
  const t = ticketOf(tid); if(!t) return;
  const prev = state.buildId && state.buildId !== tid ? ticketOf(state.buildId) : null;
  if(prev && prev.status === 'build') prev.status = 'open';
  t.status = 'build';
  state.buildId = tid;
  SFX.select();
  if(state.tab === 'build') renderBuild(); else renderRail();
  checkTutorials('loadbuild');
}
function loadFinish(tid){
  const t = ticketOf(tid); if(!t) return;
  const prev = state.finishId && state.finishId !== tid ? ticketOf(state.finishId) : null;
  if(prev && prev.status === 'finishW') prev.status = 'finish';
  t.status = 'finishW';
  state.finishId = tid;
  SFX.select();
  if(state.tab === 'finish') renderFinish(); else renderRail();
  checkTutorials('loadfinish');
}
function trashBuild(){
  const t = state.buildId ? ticketOf(state.buildId) : null;
  if(!t){ toast('工作台上没有东西','warn'); return; }
  confirmDlg({
    title:'🗑 倒掉这一份？', text:'已经做好的步骤会全部丢掉，小票不会消失，可以重新开始。',
    yes:'倒掉重来', danger:true,
    onYes:()=>{
      t.wip = emptyWip(t.spec.kind);
      SFX.bad(); toast('已清空工作台'); renderBuild(); renderRail();
    }
  });
}
function overEl(x,y,el){
  if(!el) return false;
  const r = el.getBoundingClientRect();
  return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
}
function stepChips(names, cur){
  return '<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:3px 4px">' +
    names.map((n,i)=>'<span class="chip" style="font-size:10px;'+
      (i===cur?'background:#FF6B9D;color:#fff':(i<cur?'background:#E9FBF2;color:#2E8B62':'opacity:.55'))+'">'+(i+1)+'.'+n+'</span>').join('')+'</div>';
}
function renderBuildIdle(){
  const body = $('buildBody');
  const waiting = liveTickets().filter(t=>t.status==='open');
  body.innerHTML = '';
  const box = mkEl('div','pad-area');
  const hint = mkEl('div','pad-hint');
  const st = mkEl('div','pad-stage');
  st.style.flexDirection = 'column';
  st.style.gap = '8px';
  if(!waiting.length){
    st.appendChild(mkEl('div','','<div style="text-align:center;color:#B08A6C;font-weight:700">🧾 没有待开工的小票<br><span class="small-note">先去「前台接单」点一下客人</span></div>'));
  }else{
    st.appendChild(mkEl('div','','<div style="text-align:center;font-weight:800;color:#8B6543;margin-bottom:6px">选一张小票开工</div>'));
    const row = mkEl('div','','<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"></div>');
    waiting.forEach(t=>{
      const c = mkEl('div','tray-card','<div class="pv">'+PROD[t.spec.kind].emoji+'</div><div class="tn">#'+t.no+' '+PROD[t.spec.kind].name+'</div><div class="tn">$'+t.price+'</div>');
      c.style.width = '84px';
      c.onclick = ()=>loadBuild(t.tid);
      row.firstChild.appendChild(c);
    });
    st.appendChild(row);
  }
  box.appendChild(hint); box.appendChild(st);
  body.appendChild(box);
  $('buildTitle').textContent = '后厨：等着接小票';
}
function renderBuild(){
  if(!$('buildBody')) return;
  const t = state.buildId ? ticketOf(state.buildId) : null;
  if(!t || t.status === 'finish' || t.status === 'finishW' || t.status === 'ready' || t.status === 'void'){ renderBuildIdle(); return; }
  const body = $('buildBody');
  body.innerHTML = '';
  const recipe = mkEl('div','mini-recipe');
  const pad = mkEl('div','pad-area');
  body.appendChild(pad); body.appendChild(recipe);
  $('buildTitle').textContent = '后厨 · 小票 #'+t.no+' · '+PROD[t.spec.kind].name;
  const hint = mkEl('div','pad-hint');
  const stage = mkEl('div','pad-stage');
  pad.appendChild(hint); pad.appendChild(stage);
  if(t.spec.kind === 'cake')  buildCake(t, hint, stage);
  if(t.spec.kind === 'bread') buildBread(t, hint, stage);
  if(t.spec.kind === 'tea')   buildTea(t, hint, stage);
  renderRecipe(recipe, t);
}

/* ---- 蛋糕：后厨（叠胚 / 夹心） ---- */
const CK = {WRAP:170, LH:26, MAXL:3};
function buildCake(t, hint, stage){
  const w = t.wip;
  const n = w.layers.length;
  const done = n > 0 && (n < 2 || !!w.filling);
  hint.innerHTML = '把<b>蛋糕胚</b>拖到台面上叠层，两层以上再拖<b>夹心</b>进去　' +
    '<span class="small-note">目标 '+t.spec.layers+' 层 · '+t.spec.flavor.name+'　（点蛋糕胚可以撤走一层）</span>';
  // 蛋糕本体
  const holder = mkEl('div');
  holder.style.cssText = 'position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:0';
  const wrap = mkEl('div','cake-wrap');
  wrap.style.height = Math.max(0, n*CK.LH)+'px';
  for(let j=0;j<n;j++){
    const g = layerGeom(j,n);
    const f = CAKE_F.find(x=>x.id===w.layers[j]) || CAKE_F[0];
    const el = mkEl('div','st-layer');
    el.style.cssText = 'left:'+g.x+'px;top:'+g.y+'px;width:'+g.w+'px;height:'+g.h+'px;background:'+f.color+
      ';border:2px solid '+f.border+';cursor:pointer;';
    el.title = '点一下撤走这一层';
    el.onclick = ()=>{ w.layers.splice(j,1); w.frost = null; SFX.tap(); renderBuild(); };
    wrap.appendChild(el);
  }
  if(w.filling && n >= 2){
    const gf = CAKE_G.find(x=>x.id===w.filling) || CAKE_G[0];
    for(let j=0;j<n-1;j++){
      const g = layerGeom(j,n);
      const ln = mkEl('div','st-fill');
      ln.style.cssText = 'left:'+(g.x+5)+'px;top:'+(g.y-2)+'px;width:'+(g.w-10)+'px;height:5px;background:'+gf.color+';';
      wrap.appendChild(ln);
    }
  }
  if(!n){
    const ph = mkEl('div','cake-placeholder-text','把蛋糕胚拖到这里');
    wrap.style.height = '40px';
    wrap.appendChild(ph);
  }
  holder.appendChild(wrap);
  holder.appendChild(mkEl('div','st-plate'));
  stage.appendChild(holder);
  stage.appendChild(buildShelf([
    {title:'🍰 蛋糕胚', hintTxt:'拖动或点击', items:CAKE_F.map(f=>({em:f.emoji, name:f.name, ghost:f.emoji, act:()=>addLayer(t,f)}))},
    {title:'🥄 夹心', hintTxt:'两层以上', items:CAKE_G.map(g=>({em:g.emoji, name:g.name, ghost:g.emoji, act:()=>setFill(t,g)}))}
  ], stage));
  stage.appendChild(actionBar(done, ()=>{
    if(!w.layers.length){ toast('先放蛋糕胚','warn'); return; }
    if(w.layers.length >= 2 && !w.filling){ toast('两层以上要夹一层夹心哦','warn'); return; }
    sendToFinish(t);
  }, '✅ 送去精加工台'));
}
function addLayer(t, f){
  if(t.wip.layers.length >= CK.MAXL){ toast('最多 '+CK.MAXL+' 层啦','warn'); SFX.tap(); return; }
  t.wip.layers.push(f.id);
  SFX.plop(); renderBuild(); renderRail();
  checkTutorials('layer');
}
function setFill(t, g){
  if(t.wip.layers.length < 2){ toast('先叠两层蛋糕胚才能加夹心','warn'); SFX.tap(); return; }
  t.wip.filling = g.id;
  SFX.select(); renderBuild();
  checkTutorials('fill');
}
function buildShelf(groups, stageWrap){
  const wrap = mkEl('div');
  wrap.style.cssText = 'position:absolute;left:0;right:0;top:0;z-index:4;';
  const shelf = mkEl('div','shelf');
  groups.forEach(g=>{
    shelf.appendChild(mkEl('span','sh-t', g.title));
    g.items.forEach(it=>{
      const c = mkEl('div','ing','<span class="ie">'+it.em+'</span><span class="in">'+it.name+'</span>');
      if(it.ghost != null) bindDrag(c, {ghost:it.ghost}, {onEnd:()=>it.act()});
      else c.onclick = ()=>it.act();
      shelf.appendChild(c);
    });
  });
  wrap.appendChild(shelf);
  return wrap;
}
function actionBar(enabled, fn, label){
  const bar = mkEl('div','action-bar');
  bar.style.cssText = 'position:absolute;left:0;right:0;bottom:0;padding:6px;display:flex;justify-content:center;background:linear-gradient(transparent,rgba(255,246,236,.9) 40%);z-index:5';
  const b = mkEl('button','btn sm', label);
  b.disabled = !enabled;
  b.onclick = fn;
  bar.appendChild(b);
  return bar;
}
function sendToFinish(t){
  if(state.buildId === t.tid) state.buildId = null;
  t.status = 'finish';
  checkTutorials('sendfinish');
  SFX.select(); SFX.plop();
  toast('🧺 半成品已送到加工台 #'+t.no,'good');
  // 加工台空着就直接接手
  const cur = state.finishId ? ticketOf(state.finishId) : null;
  if(!cur || cur.status === 'ready') loadFinish(t.tid);
  else renderRail();
  if(state.tab === 'build') { renderBuild(); toast('去「🎨 精加工」接着做','warn'); }
  else renderBuild();
}

/* ---- 面包：后厨（揉面 / 加料 / 发酵 / 烘烤） ---- */
const BR_STEPS = ['和面','加料','发酵','烘烤'];
function buildBread(t, hint, stage){
  const w = t.wip;
  const step = (function(){
    if(!w.dough) return 0;
    if(w.knead < 1) return 0;
    if(w.addin === null) return 1;
    if(!w.prove) return 2;
    if(!w.bakeOut) return 3;
    return 4;
  })();
  hint.innerHTML = stepChips(BR_STEPS, Math.min(step,3)) +
    '<div style="margin-top:2px">'+(step===0?'把<b>面团拖</b>到案板上，然后<b>按住面团画圈揉</b>'
      :step===1?'<b>选一样配料</b>揉进面团'
      :step===2?'<b>按住发酵</b>，进度条进<b>绿色区</b>再松手'
      :step===3?'把面团<b>拖进烤箱</b>，到达目标色就<b>点一下取出</b>'
      :'<b>✅ 可以送去精加工台啦</b>')+'</div>';
  const stages = mkEl('div');
  stages.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;';
  if(step === 0 || !w.dough){
    if(!w.dough){
      const s = mkEl('div','shelf');
      s.style.cssText = 'flex:0 0 auto;position:relative;background:none;border:none;box-shadow:none;justify-content:center';
      s.appendChild(mkEl('span','sh-t','🍞 选面团'));
      BREAD_D.forEach(d=>{
        const c = mkEl('div','ing','<span class="ie">'+d.emoji+'</span><span class="in">'+d.name+'</span>');
        bindDrag(c, {ghost:d.emoji}, {onEnd:()=>{ w.dough = d.id; SFX.plop(); renderBuild(); checkTutorials('knead'); }});
        s.appendChild(c);
      });
      stages.appendChild(s);
    }else{
      const d = BREAD_D.find(x=>x.id===w.dough);
      const dg = mkEl('div','dough','<div class="spin-ring"></div>'+ (d?d.emoji:'🍞'));
      dg.style.position = 'relative';
      const pr = mkEl('div','frost-bar','🥣 揉面 '+Math.round(w.knead*100)+'%');
      stages.appendChild(pr);
      stages.appendChild(dg);
      bindCircle(dg, {
        onTurn:turns=>{
          w.knead = Math.min(1, turns/4);
          if(w.knead >= 1){ dg.classList.remove('knead'); pr.className='frost-bar done'; pr.textContent='🥣 揉面完成 100%'; vibrate(30); SFX.plop(); checkTutorials('kneaded'); setTimeout(()=>renderBuild(), 320); }
          else { pr.textContent = '🥣 揉面 '+Math.round(w.knead*100)+'%'; }
        }
      });
      dg.addEventListener('pointerdown', ()=>dg.classList.add('knead'));
      dg.addEventListener('pointerup', ()=>dg.classList.remove('knead'));
    }
  }
  else if(step === 1){
    const s = mkEl('div','shelf');
    s.style.cssText = 'flex:0 0 auto;position:relative;background:none;border:none;box-shadow:none;justify-content:center';
    s.appendChild(mkEl('span','sh-t','🍇 加料'));
    BREAD_A.forEach(a=>{
      const c = mkEl('div','ing','<span class="ie">'+a.emoji+'</span><span class="in">'+a.name+'</span>');
      bindDrag(c, {ghost:a.emoji}, {onEnd:()=>{
        w.addin = a.id; SFX.plop();
        if(a.id!=='none') fx($('buildBody'),'coin-fx',a.emoji);
        checkTutorials('prove'); renderBuild();
      }});
      s.appendChild(c);
    });
    stages.appendChild(s);
    const prev = mkEl('div','dough', (BREAD_D.find(x=>x.id===w.dough)||BREAD_D[0]).emoji);
    prev.style.width = 'clamp(70px,13vh,100px)';
    stages.appendChild(prev);
  }
  else if(step === 2){
    stages.appendChild(pourStage({
      label:'🌡 发酵进度', cls:'', lo:52, hi:78, start:0, rate:44, btn:'🖐 按住「发酵」',
      labelFn:v=>'🌡 发酵 '+v+'%（'+Math.round(zoneScore(v,52,78,26)*100)+'分）',
      onDone:v=>{
        w.proveScore = zoneScore(v, 52, 78, 26);
        w.proveVal = v; w.prove = 1;
        SFX.plop(); vibrate(30);
        toast(w.proveScore>=.999 ? '✨ 发酵刚刚好！' : (w.proveScore>0 ? '发酵凑合能用…' : '💤 发酵没到位'), w.proveScore>=.999?'good':'warn');
        renderBuild();
        checkTutorials('bake');
      }
    }));
  }
  else if(step === 3 && !w.bakeOut){
    if(!w.baking){
      const ti = mkEl('div','frost-bar','🔥 目标：烘烤到 '+(t.spec.bake.pct-9)+'~'+(t.spec.bake.pct+9)+'% 取出 · '+t.spec.bake.name+'');
      const board = mkEl('div');
      board.style.cssText='display:flex;align-items:center;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:wrap';
      const dg = mkEl('div','dough',(BREAD_D.find(x=>x.id===w.dough)||BREAD_D[0]).emoji);
      dg.style.width='clamp(64px,11vh,88px)';
      dg.style.cursor='grab';
      const ov = mkEl('div','oven','<div class="heel">🔥 OVEN</div><div class="door">🥖</div>');
      const startBake = ()=>{
        w.baking = true;
        clearInterval(state.timers.bake);
        state.timers.bake = setInterval(()=>{
          if(!state.running || state.paused) return;
          w.bakeVal = Math.min(100, (w.bakeVal||0) + 1.5);
          const bar = document.getElementById('bakeFill');
          if(bar) bar.style.width = w.bakeVal+'%';
          const el = document.getElementById('bakeNow');
          if(el) el.textContent = Math.round(w.bakeVal)+'%';
          if(w.bakeVal >= 100){ clearInterval(state.timers.bake); SFX.bad(); }
        }, 60);
        SFX.plop2(); renderBuild();
      };
      bindDrag(dg, {ghost:'🥖'}, {onEnd:(x,y)=>{ if(overEl(x,y,ov)) startBake(); else toast('要拖到烤箱里才算进炉～','warn'); }});
      board.appendChild(dg); board.appendChild(ov);
      stages.appendChild(ti); stages.appendChild(board);
      stages.appendChild(mkEl('div','swipe-hint','👉 把面团拖进烤箱'));
    }else{
      const ov = mkEl('div','oven hot','<div class="heel">🔥 烘烤中 <b id="bakeNow">0</b>%</div>'+
        '<div class="door" id="bakeDoor" style="cursor:pointer">'+(BREAD_D.find(x=>x.id===w.dough)||BREAD_D[0]).emoji+'</div>'+
        '<div style="position:absolute;left:10px;right:10px;top:8px;height:8px;background:rgba(0,0,0,.35);border-radius:5px">'+
        '<div id="bakeFill" style="height:100%;width:0%;background:linear-gradient(90deg,#FFD54F,#FF7043);border-radius:5px"></div></div>');
      const takeOut = ()=>{
        clearInterval(state.timers.bake);
        const v = w.bakeVal || 0;
        w.baking = false; w.bakeOut = true;
        const good = Math.abs(v - t.spec.bake.pct) <= 9 && v < 100;
        SFX.plop(); vibrate(30);
        toast(good ? '✨ 火候刚好！' : (v>=100 ? '🔥 烤焦了…' : '火候差一点'), good?'good':'warn');
        checkTutorials('send');
        renderBuild();
      };
      stages.appendChild(ov);
      stages.appendChild(mkEl('div','swipe-hint','👉 到目标色时<b>点一下烤箱</b>取出'));
      setTimeout(()=>{
        const d = document.getElementById('bakeDoor');
        if(d) d.onclick = takeOut;
        const el = document.getElementById('bakeNow');
        if(el) el.textContent = Math.round(w.bakeVal||0)+'%';
        const bar = document.getElementById('bakeFill');
        if(bar) bar.style.width = (w.bakeVal||0)+'%';
      }, 0);
    }
  }
  stage.appendChild(stages);
  if(step >= 4) stage.appendChild(actionBar(true, ()=>sendToFinish(t), '✅ 送去精加工台'));
}
function vibrate(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }
function zoneScore(v, lo, hi, tol){
  const mid = (lo+hi)/2, half = (hi-lo)/2;
  const dist = Math.abs(v - mid);
  if(dist <= half) return 1;
  return Math.max(0, 1 - (dist-half)/tol);
}
function pourStage(cfg){
  const wrap = mkEl('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px';
  const label = mkEl('div','frost-bar', cfg.label);

  g.appendChild(fill); g.appendChild(zn);
  const btn = mkEl('button','pkey', cfg.btn);
  btn.style.cssText = 'padding:8px 18px;font-size:15px';

    fill.style.height = val+'%';
    label.textContent = cfg.labelFn(Math.round(val));
    g.classList.toggle('gauge-glow', val >= cfg.lo && val <= cfg.hi);
  };
  paint();
  bindHold(btn, {
    onTick: dt=>{ val = Math.min(100, val + dt*cfg.rate); paint(); SFX.pour(); },
    onEnd: ()=>cfg.onDone(val)
  });
  if(cfg.onSkip){
