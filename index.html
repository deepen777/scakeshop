    sb.onclick = cfg.onSkip;
    wrap.appendChild(sb);
  }
  return wrap;
}

/* ---- 奶茶：后厨（茶底 / 注水 / 加奶 / 加料） ---- */
const TEA_STEPS = ['茶底','注水','加奶','加料'];
function buildTea(t, hint, stage){
  const w = t.wip;
  const step = !w.base ? 0 : (w.waterS == null ? 1 : (!w.milkDone ? 2 : (!w.addinDone ? 3 : 4)));
  hint.innerHTML = stepChips(TEA_STEPS, Math.min(step,3)) + '<div style="margin-top:2px">' +
    (step===0?'先<b>选茶底</b>'
    :step===1?'<b>按住</b>水壶注水，看到进度进<b>绿区</b>松手'
    :step===2?'<b>按住</b>倒牛奶，倒到小票要求的刻度 <b>'+t.spec.milk.name+'</b>'
    :step===3?(t.spec.pearls? '按小票<b>点一下加料 '+t.spec.pearls+' 颗</b>' : '这位客人<b>不要加料</b>，确认跳过')
    :'<b>✅ 可以送去精加工台啦</b>')+'</div>';
  const stages = mkEl('div');
  stages.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px;width:100%';
  if(step === 0){
    const s = mkEl('div','shelf');
    s.style.cssText='flex:0 0 auto;position:relative;background:none;border:none;box-shadow:none;justify-content:center';
    s.appendChild(mkEl('span','sh-t','🍵 茶底'));
    TEA_B.forEach(b=>{
      const c = mkEl('div','ing','<span class="ie">'+b.emoji+'</span><span class="in">'+b.name+'</span>');
      bindDrag(c,{ghost:b.emoji},{onEnd:()=>{ w.base = b.id; SFX.plop(); checkTutorials('pour'); renderBuild(); }});
      s.appendChild(c);
    });
    stages.appendChild(s);
    stages.appendChild(mkEl('div','','<div style="font-size:50px;opacity:.5">🫖</div>'));
  }
  else if(step === 1){
    stages.appendChild(pourStage({
      label:'💧 注水中', cls:'tea', lo:WATER_LO, hi:WATER_HI, start:0, rate:52, btn:'🖐 按住「注水」',
      labelFn:v=>'💧 水位 '+v+'%',
      onDone:v=>{ w.waterVal = v; w.waterS = zoneScore(v, WATER_LO, WATER_HI, 30); SFX.plop(); vibrate(30); renderBuild(); checkTutorials('milk'); }
    }));
  }
  else if(step === 2){
    const target = t.spec.milk.pct;
    if(target <= 0){
      stages.appendChild(mkEl('div','','<div style="text-align:center"><div style="font-size:52px">🥛</div><div class="swipe-hint">小票写着<b>不加奶</b>，确认跳过</div></div>'));
      const b = mkEl('button','btn sm','⏭ 确认不加奶');
      b.onclick = ()=>{ w.milk = 0; w.milkDone = true; SFX.select(); renderBuild(); checkTutorials('addin'); };
      stages.appendChild(b);
    }else{
      stages.appendChild(pourStage({
        label:'🥛 加奶中', cls:'milk', lo:Math.max(2,target-11), hi:Math.min(96,target+11), start:0, rate:46, btn:'🖐 按住「加奶」',
        labelFn:v=>'🥛 奶量 '+v+'%（目标 '+target+'%）',
        onDone:v=>{ w.milk = v; w.milkDone = true; SFX.plop(); vibrate(30); renderBuild(); checkTutorials('addin'); }
      }));
    }
  }
  else if(step === 3){
    if(!t.spec.pearls){
      stages.appendChild(mkEl('div','','<div style="text-align:center"><div style="font-size:52px">🚫</div><div class="swipe-hint">小票写着<b>不加料</b>，确认跳过</div></div>'));
      const b = mkEl('button','btn sm','⏭ 确认不加料');
      b.onclick = ()=>{ w.addin = 'none'; w.addinDone = true; SFX.select(); renderBuild(); checkTutorials('send'); };
      stages.appendChild(b);
    }else{
      stages.appendChild(mkEl('div','frost-bar','🧋 已加 <b>'+(w.pearls.length)+'</b> / 目标 '+t.spec.pearls+' 颗'));
      const row = mkEl('div');
      row.style.cssText='display:flex;gap:8px;flex-wrap:wrap;justify-content:center';
      TEA_P.filter(p=>p.id!=='none').forEach(p=>{
        const c = mkEl('div','ing','<span class="ie">'+p.emoji+'</span><span class="in">'+p.name+'</span>');
        bindDrag(c,{ghost:p.emoji},{onEnd:()=>{
          w.addin = p.id;
          w.pearls.push(p.id);
          SFX.pop(); vibrate(12);
          renderBuild();
          if(w.pearls.length >= t.spec.pearls + 4) toast('加太多了！点一颗可以拿回来','warn');
        }});
        row.appendChild(c);
      });
      stages.appendChild(row);
      const b = mkEl('button','btn sm','✅ 加料完成，送去精加工台');
      b.onclick = ()=>{ w.addinDone = true; SFX.select(); renderBuild(); checkTutorials('send'); };
      stages.appendChild(b);
    }
  }
  stage.appendChild(stages);
  if(step >= 4) stage.appendChild(actionBar(true, ()=>sendToFinish(t), '✅ 送去精加工台'));
}
const WATER_LO = 62, WATER_HI = 84;

/* ================= 需求核对 ================= */
function topOf(t){
  if(!t.wip.tops || !t.wip.tops.length) return 'none';
  const c = {};
  t.wip.tops.forEach(x=>{ c[x.type] = (c[x.type]||0)+1; });
  let best = 'none', bn = 0;
  Object.keys(c).forEach(k=>{ if(c[k] > bn){ bn = c[k]; best = k; } });
  return best;
}
function reqLines(t){
  const s = t.spec, w = t.wip;
  if(s.kind === 'cake'){
    const same = w.layers.length > 0 && w.layers.every(x=>x===s.flavor.id);
    return [
      ['🍰', s.flavor.name+'口味', same],
      ['📶', s.layers+' 层', w.layers.length === s.layers],
      s.layers >= 2 ? ['🥄','夹心 '+s.filling.name, w.filling === s.filling.id] : null,
      ['🧈','抹面涂满', frostPct(t) >= .9],
      ['🌸', s.topping.id==='none' ? '不要装饰' : '装饰 '+s.topping.name, topOf(t) === s.topping.id]
    ].filter(Boolean);
  }
  if(s.kind === 'bread'){
    return [
      ['🥖', s.dough.name+'面团', w.dough === s.dough.id],
      ['🍇', s.addin.id==='none' ? '不用加料' : '加料 '+s.addin.name, !!w.addin && w.addin === s.addin.id],
      ['🔥', '烘烤 '+s.bake.name, bakeOk(t)],
      s.butter ? ['🧈','刷一层黄油', butterPct(t) >= .9] : ['🧈','不用刷酱', butterPct(t) <= .02],
      ['🏷️','装袋打包', !!w.packed]
    ];
  }
  return [
    ['🍵', s.base.name+'茶底', w.base === s.base.id],
    ['💧','水量适中', (w.waterS||0) >= .999],
    ['🥛', s.milk.name, milkOk(t)],
    ['⚫', s.pearls ? (s.addin.name+' ×'+s.pearls) : '不用加料', addinOk(t)],
    ['🍬', s.sweet.name, String(w.sweet) === s.sweet.id],
    ['🥤','摇匀·封口·吸管', (w.shake||0) >= 6 && !!w.sealed && !!w.straw]
  ];
}
function bakeOk(t){ return !!t.wip.bakeOut && Math.abs((t.wip.bakeVal||0) - t.spec.bake.pct) <= 9 && (t.wip.bakeVal||0) < 100; }
function milkOk(t){
  const target = t.spec.milk.pct;
  if(target <= 0) return (t.wip.milk||0) <= 1;
  return Math.abs((t.wip.milk||0) - target) <= 11;
}
function addinOk(t){
  const s = t.spec;
  if(!s.pearls) return (t.wip.pearls||[]).length === 0;
  return !!t.wip.addin && t.wip.addin === s.addin.id && t.wip.pearls.length === s.pearls && !!t.wip.addinDone;
}
function qualityOf(t){
  if(t.spec.kind === 'cake')  return frostPct(t);
  if(t.spec.kind === 'bread'){
    const a = [];
    if(t.wip.knead) a.push(t.wip.knead);
    if(t.wip.proveScore != null) a.push(t.wip.proveScore);
    if(t.spec.butter) a.push(butterPct(t));
    return a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
  }
  const a = [];
  if(t.wip.waterS != null) a.push(t.wip.waterS);
  if(t.spec.milk.pct > 0 && t.wip.milk != null) a.push(zoneScore(t.wip.milk, Math.max(2,t.spec.milk.pct-11), Math.min(96,t.spec.milk.pct+11), 22));
  return a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
}
function renderRecipe(box, t){
  box.innerHTML = '';
  box.appendChild(mkEl('h5','','🧾 小票 #'+t.no));
  reqLines(t).forEach(l=>{
    box.appendChild(mkEl('div','rc-line'+(l[2]?' ok':''), '<span class="e">'+l[0]+'</span><span>'+l[1]+'</span>'));
  });
  const doneN = reqLines(t).filter(l=>l[2]).length;
  box.appendChild(mkEl('div','small-note','💡 绿=已达标 '+doneN+'/'+reqLines(t).length));
}
function allCoreOk(t){
  const rows = reqLines(t);
  return rows.filter(r=>r[2]).length / rows.length;
}

function sendToTray(t){

/* ---- 蛋糕精加工：涂抹 + 摆装饰 ---- */
function layerGeom(j,total){
  const w = 140 - j*18;
  return {w:w, x:(CK.WRAP-w)/2, y:(total-1-j)*CK.LH, h:CK.LH};
}
function frostCells(n){
  const cells = [];
  for(let j=0;j<n;j++){
    const g = layerGeom(j,n);
    const cw = (g.w-12)/5;
    for(let k=0;k<5;k++) cells.push({x:g.x+6+k*cw, y:g.y+8, w:cw, h:12});
  }
  const gt = layerGeom(n-1,n);
  const cwt = (gt.w-12)/5;
  for(let k=0;k<5;k++) cells.push({x:gt.x+6+k*cwt, y:1, w:cwt, h:9});
  return cells;
}
function finishCake(t, hint, stage){
  const w = t.wip;
  const n = w.layers.length || 1;
  const cells = frostCells(n);
  if(!w.frost || w.frost.length !== cells.length) w.frost = cells.map(()=>false);
  const pct = Math.round(frostPct(t)*100);
  hint.innerHTML = '① <b>按住手指/鼠标在蛋糕上来回擦</b>，把虚线奶油抹光滑 → ② 把<b>装饰拖</b>到顶上摆好位置<br>' +
    '<span class="small-note">抹面 '+pct+'%（'+ (pct>=100?'满分':pct+'%') +'）　目标装饰：'+t.spec.topping.name+'</span>';
  const holder = mkEl('div');
  holder.style.cssText='position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:0';
  const bar = mkEl('div','frost-bar'+(pct>=100?' done':''), pct>=100?'🧈 抹面完成 100%':'🧈 抹面 '+pct+'%');
  bar.style.position='relative'; bar.style.top='auto'; bar.style.marginBottom='6px';
  const wrap = mkEl('div','cake-wrap');
  wrap.style.height = (n*CK.LH)+'px';
  const cellEls = [];
  for(let j=0;j<n;j++){
    const g = layerGeom(j,n);
    const f = CAKE_F.find(x=>x.id===w.layers[j]) || CAKE_F[0];
    const el = mkEl('div','st-layer');
    el.style.cssText='left:'+g.x+'px;top:'+g.y+'px;width:'+g.w+'px;height:'+g.h+'px;background:'+f.color+';border:2px solid '+f.border+';';
    wrap.appendChild(el);
    el.title = '点一下把这层撤走';
    el.style.cursor = 'pointer';
    el.onclick = ()=>{ w.layers.splice(j,1); w.frost = null; SFX.tap(); renderFinish(); };
  }
  if(w.filling && n>=2){
    const g0 = CAKE_G.find(x=>x.id===w.filling);
    for(let j=0;j<n-1;j++){
      const g = layerGeom(j,n);
      const ln = mkEl('div','st-fill');
      ln.style.cssText='left:'+(g.x+5)+'px;top:'+(g.y-2)+'px;width:'+(g.w-10)+'px;height:5px;background:'+g0.color+';';
      wrap.appendChild(ln);
    }
  }
  cells.forEach((c,i)=>{
    const el = mkEl('div','fcell'+(w.frost[i]?' smooth':''));
    el.style.cssText='left:'+c.x+'px;top:'+c.y+'px;width:'+c.w+'px;height:'+c.h+'px;';
    wrap.appendChild(el); cellEls.push(el);
  });
  const gt = layerGeom(n-1,n);
  (w.tops||[]).forEach((tp,i)=>{
    const el = mkEl('div','st-top',(CAKE_T.find(x=>x.id===tp.type)||CAKE_T[0]).emoji);
    el.style.cssText='left:'+(gt.x+tp.x*(gt.w-20))+'px;top:-22px;font-size:22px;position:absolute;cursor:grab;z-index:3';
    el.title='拖一下换位置，点一下拿走';
    bindDrag(el,{ghost:el.textContent},{onEnd:(x,y)=>{
      if(!overEl(x,y,wrap)){ w.tops.splice(i,1); SFX.tap(); }
      else { const r = wrap.getBoundingClientRect(); tp.x = cl((x-r.left-10-gt.x)/Math.max(1,gt.w-20),0,1); SFX.pop(); }
      renderFinish();
    }});
    wrap.appendChild(el);
  });
  const plate = mkEl('div','st-plate');
  holder.appendChild(bar); holder.appendChild(wrap); holder.appendChild(plate);
  stage.appendChild(holder);
  bindSmear(wrap, ()=>cells, i=>{
    if(w.frost[i]) return false;
    w.frost[i] = true; cellEls[i].classList.add('smooth'); SFX.spread(); return true;
  }, {onChange:()=>{
    const p = Math.round(frostPct(t)*100);
    bar.textContent = p>=100?'🧈 抹面完成 100%':'🧈 抹面 '+p+'%';
    bar.classList.toggle('done', p>=100);
    if(p>=100) checkTutorials('frost100');
  }});
  const shelf = mkEl('div','shelf');
  shelf.style.cssText='position:absolute;left:0;right:0;bottom:0;z-index:4';
  shelf.appendChild(mkEl('span','sh-t','🌸 装饰'));
  CAKE_T.filter(x=>x.id!=='none').forEach(tp=>{
    const c = mkEl('div','ing','<span class="ie">'+tp.emoji+'</span><span class="in">'+tp.name+'</span>');
    bindDrag(c,{ghost:tp.emoji},{onEnd:(x,y)=>{
      if(!w.layers.length){ toast('蛋糕胚还没到呢','warn'); return; }
      if((w.tops||[]).length>=6){ toast('顶上放不下了','warn'); return; }
      const r = wrap.getBoundingClientRect();
      const ratio = overEl(x,y,wrap) ? cl((x-r.left-10-gt.x)/Math.max(1,gt.w-20),0,1) : (0.15+Math.random()*0.7);
      w.tops.push({type:tp.id, x:ratio});
      SFX.pop(); renderFinish();
      checkTutorials('top');
    }});
    shelf.appendChild(c);
  });
  stage.appendChild(shelf);
  stage.appendChild(actionBar(w.layers.length>0, ()=>sendToTray(t), '✅ 做好啦，放到出餐口'));
}

/* ---- 面包精加工：刷黄油 + 装袋 ---- */
const BUTTER_COLS = 5, BUTTER_ROWS = 3, BCW = 30, BCH = 22;
function butterCells(){
  const cs = [];
  for(let r=0;r<BUTTER_ROWS;r++) for(let c=0;c<BUTTER_COLS;c++)
    cs.push({x:c*BCW, y:r*BCH, w:BCW, h:BCH});
  return cs;
}
function finishBread(t, hint, stage){
  const w = t.wip;
  const needButter = t.spec.butter;
  const step = (needButter && butterPct(t) < .999) ? 0 : (!w.packed ? 1 : 2);
  hint.innerHTML = stepChips(needButter?['刷黄油','装袋']:['不用刷酱','装袋'], Math.min(step,1)) +

/* ================= 出餐收银 ================= */
function renderServe(){
  if(!$('trayRow')) return;
  const row = $('trayRow');
  row.innerHTML = '';
  const ids = state.tray.filter(id=>{
    const t = ticketOf(id); return t && t.status === 'ready';
  });
  if(!ids.length){
    row.appendChild(mkEl('div','empty-q','🧺 出餐口是空的，先去后厨做几单吧'));
  }
  ids.forEach(id=>{
    const t = ticketOf(id);
    const c = mkEl('div','tray-card');
    c.innerHTML = '<div class="pv">'+madeSVG(t,34)+'</div><div class="tn">#'+t.no+' '+PROD[t.spec.kind].name+'</div><div class="go">🙋</div>';
    c.onclick = ()=>serveNow(t);
    row.appendChild(c);
  });
  $('trayNote').textContent = ids.length ? ('共 '+ids.length+' 份待出餐 · 点一下交给客人') : '做好的成品会放在这里';
  renderCash();
  updateThief();
}
function gradeTicket(t){
  const rows = reqLines(t);
  const okCount = rows.filter(r=>r[2]).length;
  const core = rows.length ? okCount/rows.length : 0;
  const q = qualityOf(t);
  let pct = core*.85 + q*.15;
  pct = Math.max(0, Math.min(1, pct));
  const miss = rows.filter(r=>!r[2]).map(r=>r[1]);
  return {rows:rows, ok:okCount, core:core, quality:q, pct:pct, miss:miss,
    rating: pct>=.95?'perfect':pct>=.8?'great':pct>=.6?'ok':'bad'};
}
function serveNow(t){
  if(!canPlay()) return;
  const g = gradeTicket(t);
  const base = t.price;
  let pay = Math.round(base * (0.32 + 0.68*g.pct));
  // 连击
  const comboStep = 0.06 + perkVal('rug');
  const bonus = g.rating === 'bad' ? 0 : Math.min(state.combo*comboStep, 0.5);
  pay = Math.round(pay * (1 + bonus));
  if(g.rating === 'perfect' && state.buffs.double) pay *= 2;
  if(state.buffs.tipjar) pay += 5;
  pay += Math.round(perkVal('plant'));
  pay = Math.round(pay * (1 + perkVal('window')));

  if(g.rating === 'bad') state.combo = 0;
  else {
    state.combo += (g.rating === 'perfect' ? 2 : 1);
    if(state.combo > state.maxCombo) state.maxCombo = state.combo;
    if(state.combo > state.bestCombo) state.bestCombo = state.combo;
  }
  state.money += pay;
  state.totalMoney += pay;
  state.served++;
  state.registerCash = state.money;
  state.history.push({pct:g.pct, pay:pay, no:t.no, kind:t.spec.kind});
  checkTutorials('served');

  t.status = 'done';
  state.tray = state.tray.filter(x=>x !== t.tid);
  renderRail(); renderServe(); updateTop();

  const label = g.rating==='perfect'?'🤩 完美！ +$'+pay : g.rating==='great'?'😊 很棒 +$'+pay :
                g.rating==='ok'?'🙂 一般 +$'+pay : '😕 不太对 +$'+pay;
  fx($('serveScene'), 'float-tx', label);
  fx($('serveScene'), 'coin-fx', '💰', 120 + Math.random()*80, 60);
  if(g.rating==='perfect'){ SFX.perfect(); SFX.coin(); } else if(g.rating==='bad') SFX.bad(); else { SFX.good(); SFX.coin(); }
  if(bonus > 0) setTimeout(()=>toast('🔥 连击加成 +'+Math.round(bonus*100)+'%','good'), 260);
  if(g.miss.length) setTimeout(()=>toast('小票差一点点：'+g.miss.slice(0,3).join('、'), 'warn'), 420);

  const cust = state.custs.find(x=>x.cid===t.cid);
  if(state.level >= 4 && cust) openCash(t, cust, pay);
  else finishCustomer(t.cid, g);
  save();
  if(state.money >= state.target) setTimeout(()=>{ if(state.running) endLevel(true); }, 700);
}
function finishCustomer(cid, g){
  const c = state.custs.find(x=>x.cid===cid);
  if(!c) { renderQueue(); return; }
  const q = $('custQueue');
  const el = q && q.querySelector('[data-cid="'+cid+'"]');
  if(el){ el.classList.add('leaving'); setTimeout(()=>el.remove(), 460); }
  state.custs = state.custs.filter(x=>x.cid !== cid);
  setTimeout(renderQueue, 220);
  checkTutorials('served');
}

/* ---- 收银找零 ---- */
function openCash(t, cust, pay){
  const bills = [20,50,100,200];
  let paid = bills.find(b=>b >= pay) || 200;
  if(chance(.35)){ const i = bills.indexOf(paid); if(i>=0 && i < bills.length-1) paid = bills[i+1]; }
  state.cash = {tid:t.tid, cid:cust.cid, pay:pay, paid:paid, due:paid-pay, given:0, typed:''};
  checkTutorials('cash');
  renderServe();
}
function renderCash(){
  const p = $('cashPanel'); if(!p) return;
  p.innerHTML = '';
  const c = state.cash;
  if(!c){
    p.appendChild(mkEl('div','small-note','💵 把成品交给顾客时，会在这里<b>收钱找零</b>。'));
    p.appendChild(mkEl('div','','<div style="font-size:34px;text-align:center;opacity:.5;margin-top:6px">🧾💵</div>'));
    p.appendChild(mkEl('div','small-note','第 4 关开始顾客会付整钱，要用下面的按键找零哦。'));
    return;
  }
  const scr = mkEl('div','cash-screen',
    '<div class="row"><span>这单</span><span class="hi">$'+c.pay+'</span></div>' +
    '<div class="row"><span>顾客给了</span><span>$'+c.paid+'</span></div>' +
    '<div class="row"><span>要找零</span><span class="hi">$'+c.due+'</span></div>' +
    '<div class="row"><span>已放钱</span><span>$'+c.given+'</span></div>');
  p.appendChild(scr);
  const quick = mkEl('div','paid-row');
  [1,5,10,20,50].forEach(n=>{
    const b = mkEl('div','note-item','+'+n);
    b.onclick = ()=>{
      if(!canPlay()) return;
      c.given += n; c.typed = String(c.given);
      SFX.coin(); vibrate(12); renderCash();
    };
    quick.appendChild(b);
  });
  p.appendChild(quick);
  const kp = mkEl('div','keypad');
  [1,2,3,4,5,6,7,8,9].forEach(n=>{
    const b = mkEl('button','pkey', String(n));
    b.onclick = ()=>{
      if(!canPlay()) return;
      if(c.typed.length < 3) c.typed += String(n);
      c.given = parseInt(c.typed || '0', 10);
      SFX.tap(); renderCash();
    };
    kp.appendChild(b);
  });
  const b0 = mkEl('button','pkey','0');
  b0.onclick = ()=>{ if(!canPlay()) return; if(c.typed.length<3) c.typed += '0'; c.given=parseInt(c.typed||'0',10); SFX.tap(); renderCash(); };
  const bc = mkEl('button','pkey','↺');
  bc.onclick = ()=>{ if(!canPlay()) return; c.typed=''; c.given=0; SFX.tap(); renderCash(); };
  const bo = mkEl('button','pkey wide','✅ 送出');
  bo.style.cssText = 'background:linear-gradient(#FFF0F5,#FFD9E4);color:#D6336C';
  bo.onclick = ()=>settleCash();
  kp.appendChild(bc); kp.appendChild(b0); kp.appendChild(bo);
  p.appendChild(kp);
  p.appendChild(mkEl('div','small-note','按上面的金额按键，凑够找零再按「送出」'));
}
function settleCash(){
  if(!canPlay() || !state.cash) return;
  const c = state.cash;
  const right = c.given === c.due;
  const cust = state.custs.find(x=>x.cid===c.cid);
  if(right){
    const tip = 2 + Math.floor(Math.random()*3);
    state.money += tip; state.totalMoney += tip; state.registerCash = state.money;
    SFX.kaching();
    toast('✅ 找零正确！顾客留下 $'+tip+' 小费','good');
    fx($('serveScene'),'coin-fx','🪙', 200, 70);
  }else{
    const off = Math.abs(c.given - c.due);
    const pen = Math.min(state.money, 3 + off);
    state.money -= pen; state.totalMoney = Math.max(0, state.totalMoney - pen);
    state.registerCash = state.money;
    SFX.bad();
    toast((c.given < c.due ? '找少了 $'+off : '找多了 $'+off)+'！赔了 $'+pen,'bad');
  }
  state.cash = null;
  save(); updateTop();
  if(cust) finishCustomer(c.cid);
  renderServe();
  checkTutorials('cashdone');
}

/* ---- 小偷 ---- */
function maybeThief(L){
  if(!L.thief || state.buffs.bell) return;
  if(state.thief){ return; }
  if(state.thiefCd > 0){ state.thiefCd -= .1; return; }
  if(Math.random() < L.thief * .03 * (1 - Math.min(.8, perkVal('pet')))) spawnThief();
}
function spawnThief(){
  state.thief = {hp:5, max:5, t:0, limit:7, hits:0};
  state.thiefCd = (levelCfg(state.level).thiefCd || 24);
  SFX.thief(); SFX.alarm();
  toast('🥷 有小偷！快去「出餐收银」逮住他！','bad');
  tabBadge('serve', '🥷');
  if(state.tab === 'serve') gotoTab('serve');
  else {
    fx(null,'float-tx','🥷 小偷！');
    const s = document.createElement('div');
    s.className = 'alarm'; s.textContent = '🥷 有小偷！去「出餐收银」抓他';
    $('stage').appendChild(s);
    setTimeout(()=>s.remove(), 3200);
  }
  clearInterval(state.timers.thiefT);
  state.timers.thiefT = setInterval(()=>{
    if(!state.running || state.paused){ return; }
    const th = state.thief; if(!th){ clearInterval(state.timers.thiefT); return; }
    th.t += .1;
    if(th.t >= th.limit){ thiefEscape(); return; }
    if(state.tab === 'serve') updateThief();
  }, 100);
  checkTutorials('thief');
}
function thiefHit(){
  const th = state.thief; if(!th || !canPlay()) return;
  th.hits++; th.hp--;
  SFX.plop(); vibrate(20);
  const el = document.querySelector('.thief .tb');
  if(el){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'), 210); }
  updateThief();
  if(th.hp <= 0) thiefCaught();
}
function thiefCaught(){
  clearInterval(state.timers.thiefT);
  state.thief = null;
  const reward = 20 + state.level*4;
  state.money += reward; state.totalMoney += reward; state.registerCash = state.money;
  SFX.perfect(); SFX.coin();
  toast('👮 抓住小偷！奖金 +$'+reward,'good');
  fx($('serveScene'),'coin-fx','💎',160,60);
  updateTop(); renderServe(); save(); checkTutorials('caught');
}
function thiefEscape(){
  clearInterval(state.timers.thiefT);
  state.thief = null;
  const loss = Math.min(state.money, 18 + state.level*5);
  state.money -= loss; state.totalMoney = Math.max(0, state.totalMoney - loss);
  state.registerCash = state.money;
  SFX.lose();
  toast('🥷 小偷跑掉了，被偷走 $'+loss,'bad');
  updateTop(); renderServe(); save();
}
function clearThief(force){
  clearInterval(state.timers.thiefT);
  if(state.thief && force) state.thief = null;
  const old = document.querySelector('.thief'); if(old) old.remove();
  const old2 = document.querySelector('.alarm'); if(old2) old2.remove();
}
function updateThief(){
  const sc = $('serveScene'); if(!sc) return;
  const old = sc.querySelector('.thief'); if(old) old.remove();
  const th = state.thief;
  if(!th){ tabBadge('serve', liveTickets().filter(t=>t.status==='ready').length); return; }
  const el = mkEl('div','thief');
  el.innerHTML = '<div class="tb">🥷</div><div class="thp"><div class="thpf" style="width:'+(th.hp/th.max*100)+'%"></div></div>' +
                 '<div style="font-size:9px;font-weight:800;color:#FF3D3D;background:#fff;border-radius:6px">连点 '+th.hp+' 下</div>';
  el.style.right = '18%'; el.style.bottom = '16%';
  el.onclick = thiefHit;
  sc.appendChild(el);
  const al = document.querySelector('.alarm');
  if(!al){
    const a = mkEl('div','alarm','🥷 连点小偷 '+th.hp+' 下！');
    sc.appendChild(a);
  }else{
    al.textContent = '🥷 连点小偷 '+th.hp+' 下！';
  }
  tabBadge('serve','🥷');
}

let _tutBusy = false;
function runTut(id){
  if(!TUTS[id]) return;
  if(state.tutorial && state.tutorial.id === id) return;
  state.tutorial = {id:id, i:0, got:{}, steps:TUTS[id].steps};
  renderTut();
  SFX.ding();
}
function endTut(mark){
  const tut = state.tutorial;
  if(tut){
    state.seenTut[tut.id] = true;
    save();
  }
  state.tutorial = null;
  $('tutLayer').classList.remove('on');
  $('tutLayer').innerHTML = '';
  SFX.select();
}
function tutEmit(key){
  const tut = state.tutorial;
  if(!tut || !key || !tut.steps) return;
  tut.got[key] = true;
  if(tut.i >= tut.steps.length){ return; }
  const st = tut.steps[tut.i];
  if(st && st.wait === key){
    setTimeout(()=>{
      if(state.tutorial && state.tutorial.id === tut.id) nextTut();
    }, 380);
  }
}
function nextTut(){
  const tut = state.tutorial; if(!tut || !tut.steps) return;
  if(tut.i >= tut.steps.length-1){ endTut(); return; }
  tut.i++;
  renderTut();
  SFX.tap();
}
function checkTutorials(key){
  if(!key || _tutBusy) return;
  try{ tutEmit(key); }catch(e){}
  try{
    if(!state.running) return;
    if(key === 'start' && state.level === 1 && !state.seenTut.L1 && !state.tutorial) runTut('L1');
    if(key === 'cash' && !state.seenTut.cash && !state.tutorial) runTut('cash');
    if(key === 'thief' && !state.seenTut.thief && !state.tutorial) runTut('thief');
    if(key === 'loadbuild'){
      const t = state.buildId ? ticketOf(state.buildId) : null;
      if(t && !state.tutorial){
        if(t.spec.kind === 'bread' && !state.seenTut.bread) runTut('bread');
        if(t.spec.kind === 'tea'   && !state.seenTut.tea)   runTut('tea');
      }
    }
  }catch(e){}
  try{ renderTut(); }catch(e){}
}
function renderTut(){
  const tut = state.tutorial;
  const L = $('tutLayer');
  if(!tut || !TUTS[tut.id]){ L.classList.remove('on'); L.innerHTML = ''; return; }
  const def = TUTS[tut.id];
  const st = def.steps[tut.i];
  if(!st){ endTut(); return; }
  if(st.tab && state.tab !== st.tab && state.running){
    _tutBusy = true; try{ gotoTab(st.tab); }catch(e){}
    _tutBusy = false;
  }
  L.innerHTML = '';
  L.classList.add('on');
  const stage = $('stage').getBoundingClientRect();
  let target = null;
  if(st.focus){
    const el = (st.focus.charAt(0)==='#') ? $(st.focus.slice(1)) : document.querySelector(st.focus);
    if(el && el.offsetParent !== null) target = el;
  }
  if(target){
    const r = target.getBoundingClientRect();
    const spot = mkEl('div','spot');
    spot.style.left = (r.left - stage.left - 6)+'px';
    spot.style.top  = (r.top - stage.top - 6)+'px';
    spot.style.width = (r.width + 12)+'px';
    spot.style.height = (r.height + 12)+'px';
    L.appendChild(spot);
  }
  const box = mkEl('div','tut-box');
  const ready = !st.wait || !!tut.got[st.wait];
  box.innerHTML = '<div class="tt">🎓 '+def.title+'</div><div class="tb">'+st.say+'</div>';
  const foot = mkEl('div','tf');
  foot.appendChild(mkEl('span','step',(tut.i+1)+' / '+def.steps.length));
  if(tut.i < def.steps.length-1){
    const nb = mkEl('button','btn ok'+(ready?'':' secondary'), ready?'下一步 ▶':'先照着做 👆');
    nb.disabled = !ready;
    nb.onclick = ()=>{ if(ready) nextTut(); else SFX.tap(); };
    foot.appendChild(nb);
  }else{
    const fb = mkEl('button','btn ok','🎉 我会了！');
    fb.onclick = endTut;
    foot.appendChild(fb);
  }
  box.appendChild(foot);
  const sk = mkEl('div','skip','跳过教程');
  sk.style.marginTop = '6px';
  sk.onclick = endTut;
  box.appendChild(sk);
  L.appendChild(box);
  if(target){
    const r = target.getBoundingClientRect();
    const tr = {l:r.left-stage.left, t:r.top-stage.top, r:r.right-stage.left, b:r.bottom-stage.top,
                w:r.width, h:r.height};
    const bw = box.offsetWidth, bh = box.offsetHeight, W = stage.width, H = stage.height;
    const clampP = p => ({l:Math.max(10, Math.min(p.l, W-bw-10)), t:Math.max(8, Math.min(p.t, H-bh-10))});
    const overlap = p => Math.max(0, Math.min(p.l+bw, tr.r)-Math.max(p.l, tr.l)) *
                         Math.max(0, Math.min(p.t+bh, tr.b)-Math.max(p.t, tr.t));
    // 候选位：目标下方 → 上方 → 右 → 左 → 四角；挑与操作区重叠最小的一个，尽量不挡操作
    const cands = [
      clampP({l:tr.l, t:tr.b+10}),
      clampP({l:tr.l, t:tr.t-bh-10}),
      clampP({l:tr.r+12, t:tr.t}),
      clampP({l:tr.l-bw-12, t:tr.t}),
      clampP({l:10, t:10}), clampP({l:W-bw-10, t:10}),
      clampP({l:10, t:H-bh-10}), clampP({l:W-bw-10, t:H-bh-10})
    ];
    let best = cands[0], bestOv = Infinity;
    // 除重点区外，还要避开货架/操作按钮等可交互元素
    const avoid = [...document.querySelectorAll('.shelf, .action-bar, .wb-head')]
      .filter(el=>el.offsetParent !== null)
      .map(el=>{ const b = el.getBoundingClientRect();
        return {l:b.left-stage.left, t:b.top-stage.top, r:b.right-stage.left, b:b.bottom-stage.top}; });
    const ovRect = (p, q) => Math.max(0, Math.min(p.l+bw, q.r)-Math.max(p.l, q.l)) *
                            Math.max(0, Math.min(p.t+bh, q.b)-Math.max(p.t, q.t));
    for(const p of cands){
      let ov = overlap(p);
      for(const q of avoid) ov += ovRect(p, q) * 3;   // 挡住货架/按钮的候选位重罚
      if(ov < bestOv){ bestOv = ov; best = p; }
    }
    box.style.left = best.l+'px';
    box.style.top = best.t+'px';
    // 指向箭头：按提示框相对重点区域的方位选方向，紧贴区域边缘、带弹跳动画
    const bc = {x:best.l+bw/2, y:best.t+bh/2}, tc = {x:tr.l+tr.w/2, y:tr.t+tr.h/2};
    let em, ax, ay;
    if(bc.y <= tr.t){            em='👇'; ax=tc.x-14; ay=tr.t-34; }
    else if(bc.y >= tr.b){       em='👆'; ax=tc.x-14; ay=tr.b+8; }
    else if(bc.x >= tr.r){       em='⬅️'; ax=tr.r+8; ay=tc.y-14; }
    else {                       em='👉'; ax=tr.l-36; ay=tc.y-14; }
    ax = Math.max(2, Math.min(ax, W-30));
    ay = Math.max(2, Math.min(ay, H-30));
    const arrow = mkEl('div','tut-arrow', em);
    arrow.style.left = ax+'px';
    arrow.style.top = ay+'px';
    L.appendChild(arrow);
  }else{
    // 无焦点步骤：放顶部居中，不挡中间的操作区
    box.style.left = '50%';
    box.style.top = '8px';
    box.style.transform = 'translateX(-50%)';
  }
}

const WALL_C = ['#F3E7F0','#FBF1E2','#E9EBFD','#FFF0DC'];
const FLOOR_C = ['#EBD3BB','#DFC0A0','#CDA87F','#E6CDAE'];
function openHome(){
  stopAll();
  state.running = false; state.phase = 'idle';
  hideOverlay(); closeModal();
  showScreen('homeScreen');
  renderHome();
  $('hBuffBtn').onclick = showPerks;
  const first = !state.seenTut.home;
  if(first){ state.seenTut.home = true; save(); runTut('home'); }
}
function renderHome(){
  updateTop();
  const room = $('roomEl');
  const lv = state.home.wall || 0;
  room.innerHTML = '';
  const wall = mkEl('div','wall'); wall.style.background = WALL_C[lv % WALL_C.length];
  const floor = mkEl('div','floor'); floor.style.background = FLOOR_C[lv % FLOOR_C.length];
  room.appendChild(wall); room.appendChild(floor);
  HOME_SLOTS.forEach(s=>{
    const cur = state.home[s.id] || 0;
    const p = s.pos;
    const box = mkEl('div','deco-slot'+(cur?'':' empty'));
    box.style.left = p[0]+'%'; box.style.top = p[1]+'%';
    box.style.width = p[2]+'%'; box.style.height = p[3]+'%';
    box.style.bottom = 'auto';
    if(cur){
      const em = (HOME_EMOJI[s.id]||[])[cur] || '✨';
      box.innerHTML = '<span class="d-em" style="font-size:clamp(20px,4.6vh,40px)">'+em+'</span>';
      box.title = s.name+' Lv'+cur+'（点一下查看详情）';
    }else{
      box.title = '空位：'+s.name;
    }
    box.onclick = ()=>openSlot(s.id);
    room.appendChild(box);
  });
  // 小满站在屋里
  const me = mkEl('div');
  me.style.cssText = 'position:absolute;left:46%;bottom:8%;width:56px;height:96px;cursor:pointer';
  me.innerHTML = keeperSVG(OUTFITS.find(o=>o.id===state.outfit)||OUTFITS[0]);
  me.title = '点我换衣服';
  me.onclick = openWardrobe;
  room.appendChild(me);
  renderHomeSide();
}
function renderHomeSide(){
  const side = $('homeSide');
  side.innerHTML = '';
  HOME_SLOTS.forEach(s=>{
    const cur = state.home[s.id] || 0;
    const card = mkEl('div','slot-card');
    card.innerHTML = '<h6>'+s.name+' <span class="small-note" style="font-weight:600">'+s.perk+'</span></h6>';
    const row = mkEl('div','opts');
    HOME_OPTS.forEach((o,i)=>{
      if(i === 0) return;
      const em = (HOME_EMOJI[s.id]||[])[i] || '✨';
      const owned = cur >= i;
      const can = state.totalMoney >= o.price;
      const cls = owned ? (cur === i ? 'opt eq' : 'opt own') : (can ? 'opt' : 'opt no');
      const b = mkEl('div',cls, '<span>'+em+'</span><span>Lv'+i+(owned?(cur===i?' 在用':' 已买'):' $'+o.price)+'</span>');
      b.onclick = ()=>buyFurniture(s.id, i);
      row.appendChild(b);
    });
    card.appendChild(row);
    side.appendChild(card);
  });
  const tip = mkEl('div','slot-card');
  tip.innerHTML = '<h6>💡 温馨值 '+perkSum()+'</h6><div class="small-note">家具等级越高，加成越强。点上面的按钮直接买。</div>';
  side.appendChild(tip);
}
function buyFurniture(slotId, lv){
  const s = HOME_SLOTS.find(x=>x.id===slotId);
  if(!s) return;
  const cur = state.home[slotId] || 0;
  if(lv <= cur){
    state.home[slotId] = lv; save(); SFX.select(); toast(s.name+'：换回 Lv'+lv); renderHome(); return;
  }
  const o = HOME_OPTS[lv];
  if(state.totalMoney < o.price){ toast('金币不够呀，再去卖点甜品吧～','bad'); SFX.tap(); return; }
  confirmDlg({
    title:'买下「'+s.name+' Lv'+lv+'」？',
    text:'花费 <b>$'+o.price+'</b>，永久获得：<b>'+s.perk+'</b>（每级都算）。<br><span class="small-note">当前 Lv'+cur+' → Lv'+lv+'</span>',
    yes:'买！', onYes:()=>{
      state.totalMoney -= o.price;
      state.home[slotId] = lv;
      save(); SFX.buy(); vibrate(30);
      toast('🏡 '+s.name+' 升级到 Lv'+lv+'！','good');
      renderHome();
    }
  });
}
function openSlot(slotId){
  const s = HOME_SLOTS.find(x=>x.id===slotId);
  const cur = state.home[slotId] || 0;
  const box = mkEl('div','detail-box');
  HOME_OPTS.forEach((o,i)=>{
    const em = (HOME_EMOJI[slotId]||[])[i] || '—';
    const bmk = i === 0 ? '空着' : em+' Lv'+i;
    const price = i === 0 ? '免费' : '$'+o.price;
    const val = s.fn(i);
    const txt = i === 0 ? '没有加成' : s.perk.replace(String(s.fn(1)), String(val + (s.unit==='%'?Math.round(val*100):val)));
    box.innerHTML += '<div class="d-row"><span class="de">'+(i===0?'·':em)+'</span><span>'+bmk+'</span><span class="dq">'+price+'</span></div>';
  });
  modal({
    title:'🪑 '+s.name,
    html:'当前 Lv<b>'+cur+'</b>　·　每级效果：<b>'+s.perk+'</b>',
    node:box,
    buttons:[{text:'去左边的列表购买/切换'},{text:'关闭'}]
  });
}
function showPerks(){
  const box = mkEl('div','detail-box');
  box.innerHTML = '<h4>🏡 当前小屋加成</h4>';
  HOME_SLOTS.forEach(s=>{
    const lv = state.home[s.id] || 0;
    const v = s.fn(lv);
    const shown = s.unit === '%' ? Math.round(v*100)+'%' : (s.unit==='$' ? '$'+v : v+s.unit);
    box.innerHTML += '<div class="d-row"><span class="de">'+((HOME_EMOJI[s.id]||[])[lv]||'·')+'</span><span>'+s.name+' Lv'+lv+'</span><span class="dq">'+shown+'</span></div>';
  });
  modal({title:'💗 温馨值 '+perkSum(), html:'装修会永久影响店里的表现', node:box, buttons:[{text:'知道啦'}]});
}

function openWardrobe(){
  autoPause();
  const grid = mkEl('div','outfit-grid');
  OUTFITS.forEach(o=>{
    const owned = !!state.ownedOutfits[o.id];
    const eq = state.outfit === o.id;
    const can = state.totalMoney >= o.price;
    const it = mkEl('div','outfit-item'+(eq?' eq':''),
      '<div class="oi-p">'+keeperSVG(o)+'</div><div class="oi-n">'+o.name+'</div>'+
      '<div class="oi-s">'+(eq?'✅ 已穿戴':owned?'点击穿戴':(can?'$'+o.price:'$'+o.price+' 不够'))+'</div>');
    if(!owned && !can) it.style.opacity = '.55';
    it.onclick = ()=>{
      if(owned){
        state.outfit = o.id; save(); drawKeeper(); SFX.select(); updateTop(); closeAutoPanel();
        if($('roomEl') && $('homeScreen').classList.contains('on')) renderHome();
        else setTimeout(openWardrobe, 60);
      }else if(can){
        confirmDlg({
          title:o.name, text:'花 <b>$'+o.price+'</b> 买下并立刻换上？', yes:'买下穿戴',
          onYes:()=>{
            state.totalMoney -= o.price;
            state.ownedOutfits[o.id] = true;
            state.outfit = o.id;
            save(); SFX.buy(); drawKeeper(); updateTop();
            setTimeout(openWardrobe, 60);
          }
        });
      }else{ toast('金币不够，去赚点钱再来～','bad'); SFX.tap(); }
    };
    grid.appendChild(it);
  });
  modal({title:'👗 店主衣橱', html:'💰 我的金币 <b>$'+state.totalMoney+'</b>', node:grid,
    buttons:[{text:'关闭', action:closeAutoPanel}]});
}
function openShop(){ openBag(); }

/* ================= 初始化 ================= */
function bindComic(){
  const frame = document.querySelector('.comic-frame');
  if(frame) frame.onclick = comicNext;
  $('comicNext').onclick = comicNext;
  $('comicSkip').onclick = ()=>{ state.seenTut.comic = true; save(); showComic(false); openMenu(); };
  // 电脑上也能用键盘翻页：Enter / → / 空格
  document.addEventListener('keydown', e=>{
    if(!$('comicScreen').classList.contains('on')) return;
    const tag = (e.target && e.target.tagName) || '';
    if(tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA') return;
    if(e.key === 'Enter' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      comicNext();
    }
  });
}
document.addEventListener('keydown', e=>{
  if(!e) return;
  const k = (e.key||'').toLowerCase();
  const overlay = $('modalOverlay');
  if(overlay && overlay.classList.contains('show')) return;
  if(k === 'escape'){ if(state.running && state.phase==='playing') togglePause(); return; }
  if(!state.running) return;
  const map = {1:'order', 2:'build', 3:'finish', 4:'serve'};
  if(map[k]){ gotoTab(map[k]); return; }
  if(k === ' '){
    const host = (state.tab === 'finish') ? $('finishBody') : $('buildBody');
    if(host){
      const b = host.querySelector('.pad-area > div:last-child button');
      if(b && !b.disabled){ b.click(); if(e.preventDefault) e.preventDefault(); }
    }
  }
});
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && state.running && state.phase==='playing' && !state.paused) togglePause();
});
window.addEventListener('resize', ()=>{
  if(state.tutorial) setTimeout(renderTut, 120);
});
function boot(){
  const firstTime = !load();
  drawKeeper();
  syncSound();
  bindComic();
  buildTabs();
  updateTop();
  if(firstTime || !state.seenTut.comic){ showComic(true); }
  else { openMenu(); }
}
try{ boot(); }catch(err){ console.error(err); fatal(err); }

</script>
